        Cuidado con `receptor.codigoActividad`: tiene que ser una actividad **realmente inscrita por ese contribuyente** en el Registro Único Tributario. Un código con formato válido pero inventado se acepta localmente y Hacienda lo rechaza con **-411**. Consultelo en `https://api.hacienda.go.cr/fe/ae?identificacion={cedula}`.
