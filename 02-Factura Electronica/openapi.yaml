      summary: Aceptar una factura recibida
      description: |
        Aceptación total (`05`). `condicionImpuesto: "01"` acredita el IVA completo.

        Ojo con los dos roles: **`emisorLegalId` es quien FIRMA el mensaje** (usted, el receptor de la factura), mientras que **`emisor` describe a quien EMITIÓ la factura original** (su proveedor). Además, la cédula embebida en `claveOriginal` tiene que coincidir con `emisor.numeroIdentificacion`, o la API responde `400`.

        Hacienda cruza el mensaje contra el comprobante original y devuelve **-29** si algo no calza. Dos causas, ambas fáciles de pasar por alto:

        1. **Quien firma debe ser el receptor de esa factura.** No puede aceptar un
           comprobante que no le emitieron a usted.
        2. **`totalFactura` y `montoTotalImpuesto` deben ser idénticos a los del original.**
           Tómelos de `GET /documents/clave/{clave}` (`total` y `totalImpuesto`), no los
           recalcule.
