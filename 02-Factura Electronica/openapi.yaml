tags:
  - name: Emisión de comprobantes
    description: |-
      Emitir los ocho tipos de comprobante, consultar su estado y descargar XML, PDF y la respuesta de Hacienda.

      Emitir es lo que su sistema va a hacer mil veces al día. Esta sección cubre el flujo
      completo: qué se envía, qué se recibe, cuál comprobante corresponde a cada situación y en
      qué se tropieza cada tipo.

      **Todos los ejemplos de esta página fueron emitidos contra el sandbox oficial de Hacienda y
      aceptados.** Cada endpoint trae al menos uno **sencillo** y uno **completo**.

      Los endpoints están abajo. Cada uno trae ejemplos listos para copiar: uno **sencillo** para
      el caso corriente, uno **completo** con varias líneas e impuestos, y una **referencia con
      todos los campos** que acepta.

      La explicación de cada tipo de comprobante —cuál corresponde a cada situación y en qué se
      tropieza— está arriba, en la sección **«Emisión de comprobantes»** de la guía.
  - name: Cuenta y credenciales
    description: Verificar la API key, consultar la cuenta del integrador y el consumo del período.
  - name: Certificados de firma
    description: Cargar, listar, probar y eliminar los certificados .p12 con que se firma cada emisor.
  - name: Webhooks
    description: |-
      Registrar los endpoints que reciben el veredicto de Hacienda en tiempo real, firmados con HMAC-SHA256.

      La forma recomendada de conocer el veredicto. Sin webhooks tiene que hacer polling, y el
      polling agresivo consume su rate limit sin darle nada a cambio.

      ### Eventos

      | Evento | Cuándo |
      |---|---|
      | `document.queued` | Aceptado en cola |
      | `document.signed` | XML firmado |
      | `document.sent` | Entregado a Hacienda |
      | `document.processing` | En proceso |
      | `document.accepted` | **Aceptado por Hacienda** |
      | `document.rejected` | **Rechazado por Hacienda** |
      | `document.error` | Fallo de transporte o firma |
      | `document.email_sent` | Correo entregado al receptor |
      | `document.email_failed` | Correo falló |
      | `document.receiver_mr_received` | El receptor respondió con un Mensaje Receptor |

      En la práctica, suscríbase a `document.accepted` y `document.rejected`. Los demás sirven
      para trazabilidad.

      ### Registro

      ```bash
      curl -X POST https://api.facturaencr.com/v2/efactura/webhooks \
        -H "X-API-Key: $EFACTURA_KEY" -H "X-API-Secret: $EFACTURA_SECRET" \
        -H "Content-Type: application/json" \
        -d '{
          "url": "https://su-servidor.com/hooks/efactura",
          "alias": "produccion",
          "events": ["document.accepted", "document.rejected"]
        }'
      ```

      La respuesta trae un **`secret` que se muestra una sola vez**. Guárdelo: sin él no puede
      verificar las firmas.

      La URL se valida contra SSRF: solo `https`, sin IPs privadas ni loopback ni hosts que no
      resuelvan. Ejemplos de rechazo:

      ```json
      { "error": "validation_error",     "message": "\"url\" must be a valid uri with a scheme matching the https pattern" }
      { "error": "invalid_webhook_url",  "message": "IP privada/loopback no permitida" }
      { "error": "invalid_webhook_url",  "message": "Hostname no permitido" }
      ```

      ### Cuerpo de la entrega

      ```json
      {
        "event": "document.accepted",
        "documentId": "6a640c68a06e822633e9db71",
        "timestamp": "2026-07-25T01:08:06.218Z",
        "data": {
          "clave": "50624072600310167816600100001010000000866142351111",
          "consecutivo": "00100001010000000866",
          "documentType": "01",
          "environment": "sandbox"
        }
      }
      ```

      Cabeceras que acompañan cada entrega:

      ```
      X-Efactura-Event:       document.accepted
      X-Efactura-Delivery-Id: 6a640c9f...
      X-Efactura-Timestamp:   1785978486
      X-Efactura-Signature:   t=1785978486,v1=9f8c...
      ```

      ### Verificación de firma

      El HMAC-SHA256 se calcula sobre la cadena `` `${t}.${cuerpo_crudo}` `` con el `secret` del
      webhook. **Use el cuerpo crudo**, antes de parsear el JSON: si serializa de nuevo, la firma
      no coincide.

      ```js
      const crypto = require('crypto');

      function verificar(rawBody, header, secret, toleranciaSeg = 300) {
        const partes = Object.fromEntries(
          header.split(',').map((kv) => kv.split('=').map((s) => s.trim()))
        );
        const t = Number(partes.t);
        if (!t || Math.abs(Date.now() / 1000 - t) > toleranciaSeg) return false; // anti-replay

        const esperado = crypto
          .createHmac('sha256', secret)
          .update(`${t}.${rawBody}`)
          .digest('hex');

        // Comparación en tiempo constante
        const a = Buffer.from(esperado, 'hex');
        const b = Buffer.from(partes.v1, 'hex');
        return a.length === b.length && crypto.timingSafeEqual(a, b);
      }

      // Express: capture el cuerpo crudo
      app.post('/hooks/efactura',
        express.raw({ type: 'application/json' }),
        (req, res) => {
          if (!verificar(req.body.toString('utf8'), req.get('X-Efactura-Signature'), process.env.WEBHOOK_SECRET)) {
            return res.sendStatus(401);
          }
          res.sendStatus(200);          // responda YA
          encolar(JSON.parse(req.body)); // procese después
        }
      );
      ```

      ```python
      import hmac, hashlib, time

      def verificar(raw_body: bytes, header: str, secret: str, tolerancia: int = 300) -> bool:
          partes = dict(kv.strip().split('=', 1) for kv in header.split(','))
          t = int(partes['t'])
          if abs(time.time() - t) > tolerancia:
              return False
          esperado = hmac.new(
              secret.encode(),
              f"{t}.".encode() + raw_body,
              hashlib.sha256,
          ).hexdigest()
          return hmac.compare_digest(esperado, partes['v1'])
      ```

      ```php
      <?php
      function verificar(string $rawBody, string $header, string $secret, int $tolerancia = 300): bool {
          $partes = [];
          foreach (explode(',', $header) as $kv) {
              [$k, $v] = explode('=', trim($kv), 2);
              $partes[$k] = $v;
          }
          if (abs(time() - (int) $partes['t']) > $tolerancia) return false;
          $esperado = hash_hmac('sha256', $partes['t'] . '.' . $rawBody, $secret);
          return hash_equals($esperado, $partes['v1']);
      }
      ```

      ### Reglas del handler

      1. **Responda `2xx` de inmediato** y procese en segundo plano. Un handler lento provoca
         reintentos y entregas duplicadas.
      2. **Sea idempotente.** Use `X-Efactura-Delivery-Id` o la `clave` para descartar repetidos:
         una entrega puede llegar más de una vez por diseño.
      3. **No confíe en el orden.** `document.accepted` puede llegar antes que `document.sent`.
      4. **Valide la firma siempre**, incluso en desarrollo.

      Si su endpoint falla, se reintenta con backoff exponencial. Consulte el historial con
      `GET /webhooks/{id}/deliveries`, y pruebe su endpoint sin emitir nada con
      `POST /webhooks/{id}/test`.
  - name: Emisores y consecutivos
    description: Numeración por sucursal y caja, reserva previa de clave y branding del PDF por emisor.
  - name: Catálogo CABYS
    description: Buscar y validar códigos del Catálogo de Bienes y Servicios del BCCR antes de facturar.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
        example: pedido-2026-04-15-000123
      description: |
        Identificador único que **vos** generás por operación de negocio (no por reintento). Misma clave + mismo body → devuelve el resultado original sin volver a emitir. Misma clave + body distinto → `409 idempotency_conflict`. TTL 24 h.

        Usá algo estable y derivado de tu dominio (`pedido-123`, `orden-2026-04-15-77`), no un UUID nuevo en cada intento: si tu proceso se cae después de enviar pero antes de guardar la respuesta, el reintento con la misma clave es lo que evita **facturar dos veces**.
  responses:
    Unauthorized:
      description: Credenciales inválidas o ausentes (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: 'Credenciales inválidas: revisá X-API-Key y X-API-Secret.'
            requestId: req_01HZY8Q4X2K7
    Forbidden:
      description: |
        Scope insuficiente, integrador suspendido o plan sin acceso API (`forbidden_scope` / `integrator_suspended` / `plan_no_api_access`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden_scope
            message: Esta API key no tiene el scope `documents:write`.
            requestId: req_01HZY8Q4X2K7
    NotFound:
      description: Recurso no encontrado (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe un documento con ese identificador en esta cuenta.
            requestId: req_01HZY8Q4X2K7
    ValidationError:
      description: |
        Datos inválidos (`validation_error`). `details` lista **cada** campo que falló, con la ruta exacta dentro del body. Nada se emitió y **no se consumió consecutivo**.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: validation_error
            message: El cuerpo de la petición no es válido.
            details:
              - field: detalle[0].impuesto[0].codigoTarifa
                message: codigoTarifa es obligatorio para la familia IVA (códigos 01, 07 y 08).
              - field: plazoCredito
                message: plazoCredito es obligatorio cuando condicionVenta = 02.
            requestId: req_01HZY8Q4X2K7
    RateLimited:
      description: |
        Excediste el rate limit (`rate_limited`). Respetá la cabecera `Retry-After` y reintentá con **la misma** `Idempotency-Key`: no se emitió nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            message: Demasiadas peticiones. Reintentá en 12 segundos.
            requestId: req_01HZY8Q4X2K7
    Conflict:
      description: |
        `idempotency_conflict`: reusaste una `Idempotency-Key` con un body distinto al original. Cambiá la clave si de verdad es otra operación, o corregí el body si querés reintentar la misma.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: idempotency_conflict
            message: La Idempotency-Key `pedido-2026-04-15-000123` ya se usó con un cuerpo distinto.
            requestId: req_01HZY8Q4X2K7
    PayloadTooLarge:
      description: '`pdf_too_large`: el `pdfBase64` adjunto supera 15 MB.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pdf_too_large
            message: El PDF adjunto supera el máximo de 15 MB.
            requestId: req_01HZY8Q4X2K7
  examples:
