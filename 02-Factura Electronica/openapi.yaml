        El descuento baja la base imponible antes del IVA. Con más de un medio de pago, cada uno exige `monto` y la **suma debe igualar el total del comprobante** (impuestos y otros cargos incluidos), o la API responde `MEDIO_PAGO_SUMA_INVALIDA`.
