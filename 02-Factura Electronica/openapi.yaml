  schemas:
    Error:
      type: object
      required:
        - error
      description: |
        Forma **uniforme** de todos los errores de la API. Programá contra `error` (código estable), nunca contra `message` (texto legible, puede cambiar).
      properties:
        error:
          type: string
          description: Código estable de error. Ver el capítulo «Códigos de error» de la guía.
          example: validation_error
        message:
          type: string
          description: Mensaje legible en español. En producción algunos mensajes 5xx se enmascaran.
          example: El cuerpo de la petición no es válido.
        details:
          type: array
          description: |
            Solo en `validation_error`: lista de campos que fallaron. `path` usa notación de puntos con índice numérico (`detalle.0`, no `detalle[0]`) y viene **vacío** cuando el fallo es de una regla transversal y no de un campo puntual. `msg` y `message` traen siempre el mismo texto (duplicado por compatibilidad): leé `message`.
          items:
            type: object
            properties:
              path:
                type: string
                description: Ruta del campo en notación de puntos. Vacío si la regla no es de un campo puntual.
                example: detalle.0
              msg:
                type: string
                description: Alias histórico de `message`. Mismo contenido.
              message:
                type: string
                example: 'La exoneración excede el IVA de la línea: montoExoneracion=9999 pero el IVA (13%) sobre la base 1000.00 es 130.00 como máximo.'
        requestId:
          type: string
          description: Identificador de la petición. **Incluilo siempre** al abrir un ticket de soporte.
          example: req_01HZY8Q4X2K7
    EmisorBrandingInput:
      type: object
      minProperties: 1
      description: |
        Campos personalizables del PDF del emisor. Todos opcionales; enviá solo los que querés cambiar (merge parcial). Un string vacío ('') limpia el campo.
      properties:
        logo:
          type: string
          description: |
            Logo como data URL base64 (`data:image/png;base64,...`) al ENVIAR. El servidor lo guarda en object storage (Cloudflare R2) y lo inyecta dentro del PDF al generarlo. Máx. ~400 KB (560 000 caracteres). PNG/JPG/WEBP/GIF. En las respuestas no se devuelve el binario: ver `hasLogo`.
          maxLength: 560000
          pattern: ^data:image\/(png|jpe?g|webp|gif);base64,
        accentColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: Color de la caja del logo (#RRGGBB).
          example: '#7C3AED'
        website:
          type: string
          maxLength: 160
          example: https://comercialxyz.com
        paymentInfo:
          type: string
          maxLength: 600
          description: Bloque «Información de pago». Aparece en proformas y facturas a crédito.
          example: |-
            Cuenta IBAN CR05015202001026284066 (BAC, colones)
            SINPE Móvil 8888-8888
        thankYouMessage:
          type: string
          maxLength: 200
          example: ¡Gracias por su compra!
        contactName:
          type: string
          maxLength: 120
          description: Sobreescribe el nombre del emisor en el bloque «Contacto».
          example: Comercial XYZ S.A.
        contactPhone:
          type: string
          maxLength: 40
          example: 2222-1111
        contactEmail:
          type: string
          maxLength: 160
          example: facturacion@comercialxyz.com
        contactAddress:
          type: string
          maxLength: 200
          example: San José, Catedral, Edificio Plaza, oficina 5
    EmisorBranding:
      type: object
      description: Branding devuelto por la API. No incluye el binario del logo (vive en R2); usar `hasLogo`.
      properties:
        emisorLegalId:
          type: string
          description: Cédula del emisor al que pertenece este branding.
          example: '3101456789'
        hasLogo:
          type: boolean
          description: '`true` si el emisor tiene un logo cargado.'
          example: true
        accentColor:
          type: string
          example: '#7C3AED'
        website:
          type: string
          example: https://comercialxyz.com
        paymentInfo:
          type: string
          example: Cuenta IBAN CR05015202001026284066 (BAC, colones)
        thankYouMessage:
          type: string
          example: ¡Gracias por su compra!
        contactName:
          type: string
          example: Comercial XYZ S.A.
        contactPhone:
          type: string
          example: 2222-1111
        contactEmail:
          type: string
          example: facturacion@comercialxyz.com
        contactAddress:
          type: string
          example: San José, Catedral, Edificio Plaza, oficina 5
    Account:
      type: object
      description: Datos de la cuenta de integrador dueña de la API key en uso.
      properties:
        id:
          type: string
          example: 65fb3c2a9e1d4f0012ab34cd
        name:
          type: string
          example: Soluciones Informáticas del Valle S.A.
        legalId:
          type: string
          description: Cédula del integrador (no la del comercio que factura).
          example: '3101778899'
        contactEmail:
          type: string
          format: email
          example: soporte@sivalle.cr
        contactPhone:
          type: string
          example: 2100-5050
        status:
          type: string
          enum:
            - trial
            - active
            - suspended
          description: '`suspended` bloquea toda emisión (`403 integrator_suspended`).'
          example: active
        defaultEnvironment:
          type: string
          enum:
            - sandbox
            - production
          description: Ambiente que se usa cuando ni la key ni el certificado lo fijan.
          example: production
        monthlyQuota:
          type: integer
          nullable: true
          description: Cupo mensual del plan (`null` = sin tope duro).
          example: 5000
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T09:12:44.000Z'
    UsageSummary:
      type: object
      description: Consumo del mes (por defecto el mes CR actual; se puede pedir otro con `?yearMonth`).
      properties:
        yearMonth:
          type: string
          example: 2026-07
        timezone:
          type: string
          example: America/Costa_Rica
        totals:
          type: object
          description: Comprobantes emitidos por tipo (claves `01`..`09`) más `total`.
          properties:
            '01':
              type: integer
              description: Facturas electrónicas.
              example: 412
            '02':
              type: integer
              description: Notas de débito.
              example: 3
            '03':
              type: integer
              description: Notas de crédito.
              example: 18
            '04':
              type: integer
              description: Tiquetes electrónicos.
              example: 1290
            '05':
              type: integer
              description: Mensajes receptor (aceptación).
              example: 74
            '06':
              type: integer
              description: Mensajes receptor (aceptación parcial).
              example: 2
            '07':
              type: integer
              description: Mensajes receptor (rechazo).
              example: 1
            '08':
              type: integer
              description: Facturas de compra.
              example: 9
            '09':
              type: integer
              description: Facturas de exportación.
              example: 0
            total:
              type: integer
              example: 1809
        billable:
          type: integer
          description: 'Comprobantes **facturables** del período. Los de sandbox NO entran acá: van en `sandboxBillable`.'
          example: 0
        sandboxBillable:
          type: integer
          description: |
            Comprobantes de sandbox del período. Se contabilizan aparte y **no** avanzan los tramos de producción: el sandbox tiene su propia progresión.
          example: 1826
        amountProjected:
          type: number
          description: Monto facturable proyectado del mes, en la moneda de `currency`.
        nextDocumentPrice:
          type: number
          description: Lo que costaría emitir el siguiente documento, según el tramo vigente.
        currency:
          type: string
          example: CRC
        tierBreakdown:
          type: array
          description: |
            Desglose del consumo del período por tramo. El costo por documento baja conforme sube el volumen; los valores concretos dependen del plan de cada integrador.
          items:
            type: object
            properties:
              fromCount:
                type: integer
                description: Primer documento del tramo (inclusive).
                example: 1
              toCount:
                type: integer
                nullable: true
                description: Último documento del tramo (inclusive). `null` en el tramo abierto final.
              pricePerDoc:
                type: number
                description: Costo unitario dentro del tramo.
              count:
                type: integer
                description: Documentos del período que cayeron en este tramo.
                example: 0
              subtotal:
                type: number
                description: '`count × pricePerDoc`.'
        quota:
          type: integer
          nullable: true
          description: Cupo del plan para el período (`null` = sin tope duro).
          example: 5000
        closed:
          type: object
          nullable: true
          x-note: Montos sin ejemplo a propósito; dependen del plan de cada integrador.
          description: |
            Cierre del período. Puede venir con el acumulado del mes en curso aunque el mes aún NO haya cerrado; `null` solo cuando no hay datos.
          properties:
            amount:
              type: number
              description: Monto del período.
            closedAt:
              type: string
              format: date-time
              example: '2026-08-01T06:00:12.000Z'
            invoiceNumberInternal:
              type: string
              description: Consecutivo interno de la factura de cierre del período.
              example: FE-2026-07-000418
    Emisor:
      type: object
      description: |
        Datos de registro del emisor (contribuyente) ante Hacienda v4.4. **El emisor nunca se envía en el body de una emisión**: se resuelve del certificado. Este objeto se define al subir el `.p12` y se devuelve dentro de `Certificate`.

        ⚠️ `provincia`, `canton` y `distrito` deben coincidir **exactamente** con lo que el contribuyente tiene registrado en la Dirección General de Tributación. Si no, Hacienda rechaza con **-37** aunque el resto del comprobante sea perfecto.
      required:
        - tipoIdentificacion
        - numeroIdentificacion
        - nombre
        - codigoActividad
        - correoElectronico
        - telefono
        - ubicacion
      properties:
        tipoIdentificacion:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
          description: 01 Física, 02 Jurídica, 03 DIMEX, 04 NITE. Los tipos 05 y 06 **no pueden ser emisores**, solo receptores.
          example: '02'
        numeroIdentificacion:
          type: string
          description: |
            Longitud exacta según tipo: 01→9, 02→10, 03→11 o 12, 04→10. Sin guiones ni ceros de relleno a mano. Desde v4.4 admite letras en jurídicas.
          example: '3101678166'
        nombre:
          type: string
          maxLength: 100
          description: Razón social tal como está inscrita.
          example: UNDAMO DE ALAJUELA SOCIEDAD ANONIMA
        nombreComercial:
          type: string
          maxLength: 80
          nullable: true
          example: Panadería Undamo
        registroFiscal8707:
          type: string
          maxLength: 12
          nullable: true
          description: Registro de bebidas alcohólicas (Ley 8707). Obligatorio si factura CABYS de licor.
          example: '12345678'
        codigoActividad:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Actividades económicas inscritas; **la primera es la principal** y es la que se usa por defecto al emitir. Cada código tiene 6 caracteres y admite las dos grafías que devuelve Hacienda: `"107190"` o `"1071.9"`. Si mandás un string suelto, se envuelve.
          items:
            type: string
            pattern: ^[0-9]+(\.[0-9]+)?$
            minLength: 6
            maxLength: 6
          example:
            - '1071.9'
            - '4711.2'
        correoElectronico:
          type: string
          format: email
          maxLength: 160
          example: facturacion@undamo.cr
        otrosCorreos:
          type: array
          maxItems: 3
          description: Copias del comprobante emitido (además de `correoElectronico`).
          items:
            type: string
            format: email
            maxLength: 160
          example:
            - contabilidad@undamo.cr
        telefono:
          $ref: '#/components/schemas/Telefono'
        telefonoFax:
          $ref: '#/components/schemas/Telefono'
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        regimen:
          type: string
          enum:
            - tradicional
            - simplificado
          readOnly: true
          description: |
            Régimen tributario detectado automáticamente al validar el certificado (solo lectura).

            ⚠️ **Determina cómo se traduce lo que enviás.** Si el emisor es `simplificado`, la plataforma **reescribe el IVA de todas las líneas a exento** (`codigoTarifa` → `10`, `tarifa` → `0`) y el monto entero se declara en `TotalExento`, aunque hayas mandado 13 %. Es correcto —el régimen simplificado no traslada IVA— pero es **silencioso**: no hay entrada en `warnings`. Consultá este campo antes de emitir si tu sistema concilia los totales que envió contra los que devuelve la API.
          example: tradicional
        billingType:
          type: string
          readOnly: true
          description: Perfil de facturación derivado de tipo de identificación + régimen (ej. `juridico_tradicional`, `juridico_simplificado`).
          example: juridico_tradicional
        regimenVerifiedAt:
          type: string
          format: date-time
          readOnly: true
          description: Cuándo se verificó el régimen contra Hacienda por última vez.
          example: '2026-07-07T22:17:35.939Z'
        regimenOverride:
          type: string
          nullable: true
          readOnly: true
          description: |
            Régimen forzado manualmente. **Solo se permite en certificados de sandbox**, para poder probar el comportamiento del otro régimen. `null` en producción.
          example: null
    Certificate:
      type: object
      description: |
        Certificado de firma tal como aparece en el listado. **La llave privada nunca se devuelve** por ningún endpoint.
      properties:
        id:
          type: string
          description: Usalo como `certificateId` al emitir.
          example: 6a4d7b00899e08b9a0d4011f
        alias:
          type: string
          description: Etiqueta legible que le pusiste al subirlo.
          example: UNDAMO DE ALAJUELA SOCIEDAD ANONIMA (sandbox)
        environment:
          type: string
          enum:
            - sandbox
            - production
          description: Ambiente de Hacienda contra el que firma. Un certificado de sandbox **no** puede emitir en producción.
          example: sandbox
        source:
          type: string
          enum:
            - api
            - portal
          description: |
            Dónde se cargó. Los certificados con `source: api` **no se pueden usar para emitir manualmente desde el portal**: quedan reservados a la integración.
          example: portal
        subject:
          type: string
          example: serialNumber=CPJ-3-101-678166, C=CR, O=PERSONA JURIDICA, OU=CPJ, CN=UNDAMO DE ALAJUELA SOCIEDAD ANONIMA
        issuer:
          type: string
          example: C=CR, O=MINISTERIO DE HACIENDA - SANDBOX, OU=DGT, CN=CA PERSONA JURIDICA - SANDBOX
        notBefore:
          type: string
          format: date-time
          example: '2026-07-07T22:15:21.000Z'
        notAfter:
          type: string
          format: date-time
          description: Vencimiento. Renovalo antes; un certificado vencido bloquea toda emisión de ese emisor.
          example: '2030-07-06T22:15:21.000Z'
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
          example: active
        lastTestAt:
          type: string
          format: date-time
          nullable: true
          description: Última vez que se probó con `POST /certificates/{id}/test`.
          example: '2026-07-17T19:12:14.199Z'
        lastTestSuccess:
          type: boolean
          nullable: true
          example: true
        haciendaUsername:
          type: string
          description: Usuario del ATV asociado al certificado.
          example: cpj-3-101-678166@stag.comprobanteselectronicos.go.cr
        haciendaClientId:
          type: string
          nullable: true
          description: '`api-stag` en sandbox, `api-prod` en producción.'
          example: api-stag
        emisor:
          $ref: '#/components/schemas/Emisor'
    CertificateCreated:
      type: object
      description: |
        Respuesta al subir o reemplazar un certificado. La llave privada se cifra en reposo y **no se devuelve nunca**.
      properties:
        id:
          type: string
          description: Úselo como `certificateId` al emitir.
          example: 6a4d7b00899e08b9a0d4011f
        alias:
          type: string
          example: UNDAMO DE ALAJUELA SOCIEDAD ANONIMA (sandbox)
        environment:
          type: string
          enum:
            - sandbox
            - production
          example: sandbox
        subject:
          type: string
          description: Sujeto del certificado
          extraído del `.p12`.: null
          example: serialNumber=CPJ-3-101-678166, C=CR, O=PERSONA JURIDICA, OU=CPJ, CN=UNDAMO DE ALAJUELA SOCIEDAD ANONIMA
        issuer:
          type: string
          description: Autoridad certificadora que lo emitió.
          example: C=CR, O=MINISTERIO DE HACIENDA - SANDBOX, OU=DGT, CN=CA PERSONA JURIDICA - SANDBOX
        notBefore:
          type: string
          format: date-time
          example: '2026-07-07T22:15:21.000Z'
        notAfter:
          type: string
          format: date-time
          description: Vencimiento. Un certificado vencido bloquea toda emisión de ese emisor.
          example: '2030-07-06T22:15:21.000Z'
        daysRemaining:
          type: integer
          description: 'Días hasta el vencimiento. Vigílelo: renovar tarde deja al comercio sin poder facturar.'
          example: 1442
        regimen:
          type: string
          enum:
            - tradicional
            - simplificado
          description: |
            Régimen detectado al validar el certificado. ⚠️ Con `simplificado`, la plataforma reescribe el IVA de todas las líneas a exento — vea `Emisor.regimen`.
          example: tradicional
        billingType:
          type: string
          description: Perfil de facturación derivado de tipo de identificación + régimen.
          example: juridico_tradicional
        replaced:
          type: boolean
          description: |
            `true` si reemplazó un certificado existente del mismo emisor y ambiente; en ese caso la respuesta es `200` en vez de `201`. Así se renueva un `.p12` vencido: se vuelve a subir y el `certificateId` anterior deja de usarse.
          example: false
        removedDuplicates:
          type: integer
          description: Certificados duplicados del mismo emisor y ambiente que se eliminaron al reemplazar.
          example: 0
    Ubicacion:
      type: object
      required:
        - provincia
        - canton
        - distrito
      description: |
        Ubicación geográfica según el catálogo oficial de Hacienda. `canton` y `distrito` van con **dos dígitos y cero a la izquierda** (`"01"`, no `"1"`), y son relativos a la provincia: el cantón `01` de provincia `1` no es el mismo que el de provincia `2`.
      properties:
        provincia:
          type: string
          pattern: ^[1-7]$
          description: 1 San José, 2 Alajuela, 3 Cartago, 4 Heredia, 5 Guanacaste, 6 Puntarenas, 7 Limón.
          example: '2'
        canton:
          type: string
          pattern: ^\d{2}$
          example: '01'
        distrito:
          type: string
          pattern: ^\d{2}$
          example: '01'
        barrio:
          type: string
          minLength: 5
          maxLength: 50
          description: 'v4.4 cambió el tipo: ahora es el **NOMBRE** del barrio, no el código de 2 dígitos de v4.3.'
          example: San Rafael
        otrasSenas:
          type: string
          maxLength: 250
          description: Dirección exacta en texto libre.
          example: GUADALUPE CALLE LA FLORI EN LA ENTRADA CONTIGUO A LA PULPERIA
    Telefono:
      type: object
      required:
        - numTelefono
      properties:
        codigoPais:
          type: string
          pattern: ^\d{1,3}$
          default: '506'
          description: Código telefónico del país
          sin `+`.: null
          example: '506'
        numTelefono:
          type: string
          pattern: ^\d{5,20}$
          description: Solo dígitos — sin guiones
          espacios ni paréntesis.: null
          example: '71725455'
    Receptor:
      type: object
      description: Datos del receptor del comprobante (campos PLANOS, no anidados).
      required:
        - tipoIdentificacion
        - numeroIdentificacion
        - nombre
      properties:
        tipoIdentificacion:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
          description: |
            01 Física, 02 Jurídica, 03 DIMEX, 04 NITE, 05 Extranjero no domiciliado.

            El tipo `05` es la vía para un receptor sin cédula costarricense: su identificador (pasaporte, tax ID, lo que sea) va en `numeroIdentificacion`, que en ese caso admite letras, y la dirección va en `otrasSenasExtranjero` en vez de `ubicacion`. Hacienda valida DIMEX y NITE contra su padrón: un número inventado se rechaza con **-38**.
          example: '01'
        numeroIdentificacion:
          type: string
          description: 'Charset `[0-9A-Za-z]`. Longitud por tipo: 01→9, 02→10, 03→11–12, 04→10, 05→1–20.'
          example: '112340567'
        nombre:
          type: string
          minLength: 1
          maxLength: 160
          example: Juan Pérez
        nombreComercial:
          type: string
          maxLength: 80
          description: Nombre de fantasía
          si difiere de la razón social.: null
          example: Comercial XYZ
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        otrasSenasExtranjero:
          type: string
          maxLength: 300
          description: Dirección del receptor extranjero. Se usa **en lugar de** `ubicacion` cuando `tipoIdentificacion` = 05.
          example: 1200 Brickell Ave, Miami, FL 33131, USA
        telefono:
          $ref: '#/components/schemas/Telefono'
        correoElectronico:
          type: string
          format: email
          maxLength: 160
          description: Destino del envío automático del comprobante, si tenés el add-on de correo activo.
          example: juan@cliente.com
        codigoActividad:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Actividad económica del receptor (6 caracteres, con punto opcional).
    ReceptorFEC:
      description: Receptor de una Factura de Compra (es el VENDEDOR/firmante). `codigoActividad` es OBLIGATORIO.
      allOf:
        - $ref: '#/components/schemas/Receptor'
        - type: object
          required:
            - codigoActividad
    CodigoComercial:
      type: object
      required:
        - tipo
        - codigo
      properties:
        tipo:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '99'
        codigo:
          type: string
          maxLength: 20
    Descuento:
      type: object
      required:
        - montoDescuento
      properties:
        montoDescuento:
          type: number
          minimum: 0
          description: |
            Monto del descuento en la moneda del comprobante, **no un porcentaje**. Se resta del subtotal de la línea **antes** de calcular el IVA: un descuento de 1 000 sobre una línea de 10 000 deja una base de 9 000 y un IVA del 13 % de 1 170.
          example: 1000
        codigoDescuento:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '99'
          description: |
            Naturaleza del descuento (v4.4, Anexo Nota 20).

            | Código | Naturaleza |
            |---|---|
            | `01` | Regalía |
            | `02` | Promoción |
            | `03` | Bonificación |
            | `04` | Descuento por pronto pago |
            | `05` | Descuento por volumen |
            | `06` | Descuento estacional |
            | `07` | Descuento por cupón |
            | `08` | Costo financiero |
            | `09` | Descuento por fidelización |
            | `99` | Otros (requiere `codigoDescuentoOtro` y `naturalezaDescuento`) |

            ⚠️ Los códigos `01` (Regalía) y `03` (Bonificación) exigen que el descuento sea el
            **100 % del monto de la línea** —el bien se entrega gratis— y el **emisor asume el IVA**.
            Un "descuento general parcial" con código `01` no existe.
        codigoDescuentoOtro:
          type: string
          minLength: 1
          maxLength: 100
          description: Código propio del descuento. **Obligatorio si `codigoDescuento` = 99.**
          example: DESC-TEMPORADA-2026
        naturalezaDescuento:
          type: string
          maxLength: 80
          description: |
            Descripción libre del descuento. **Obligatoria si `codigoDescuento` = 99**; sin ella Hacienda rechaza con `-41`. Conviene enviarla siempre: es lo que el receptor ve en el comprobante.
          example: Promoción de temporada
    DatosImpuestoEspecifico:
      type: object
      description: |
        Base de cálculo de los impuestos **por unidad** (códigos `03`, `04`, `05`, `06`, `12`).

        | Código | Fórmula del monto |
        |---|---|
        | `03` combustible | `cantidadUnidadMedida × impuestoUnidad` |
        | `04` alcohol | `proporcion = cantidadUnidadMedida × porcentaje / 100` → `monto = cantidad × proporcion × impuestoUnidad` |
        | `05` bebidas envasadas | `cantidad × cantidadUnidadMedida × (impuestoUnidad / volumenUnidadConsumo)` |
        | `06` tabaco | `cantidad × cantidadUnidadMedida × impuestoUnidad` |
        | `12` cemento | `cantidadUnidadMedida × impuestoUnidad` |

        `cantidad` es la cantidad de la línea; `cantidadUnidadMedida` son las **unidades
        gravadas** (litros, mL, sacos…).

        El código `04` grava el **alcohol absoluto**: una botella de 750 mL a 12° tiene 90 mL
        de alcohol puro (750 × 12 / 100). **Sí se divide entre 100** (si no → -471 / -473).
        Además, el emisor debe tener cargado su `registroFiscal8707` (Ley 8707).
      properties:
        cantidadUnidadMedida:
          type: number
          minimum: 0
          description: |
            Unidades **gravadas** de la línea: litros de combustible, mL de bebida, sacos de cemento. No es la cantidad vendida (eso es `cantidad` de la línea), sino la magnitud sobre la que se calcula el impuesto. Si se omite, se usa la `cantidad` de la línea, que casi nunca es lo que quiere.
          example: 350
        impuestoUnidad:
          type: number
          minimum: 0
          description: Monto en colones que el impuesto cobra **por cada unidad gravada**. Lo publica Hacienda por producto.
          example: 2
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          description: Grado alcohólico de la bebida. **Requerido para el código 04**; se ignora en los demás.
          example: 5
        proporcion:
          type: number
          minimum: 0
          description: |
            Proporción de alcohol absoluto. Normalmente **no la envíe**: se deriva de `cantidadUnidadMedida × porcentaje / 100`. Solo mándela si necesita forzar un valor distinto al derivado.
          example: 17.5
        volumenUnidadConsumo:
          type: number
          minimum: 0
          description: mL del envase individual. **Requerido para el código 05**; sin él Hacienda rechaza con `-459`.
          example: 350
    Exoneracion:
      type: object
      required:
        - tipoDocumento
        - numeroDocumento
        - fechaEmision
        - nombreInstitucion
        - porcentajeExoneracion
        - montoExoneracion
      description: |
        Exoneración aplicada al impuesto de la línea.

        ⚠️ **`TarifaExonerada` NO es "el porcentaje de la exoneración"**: es **la tarifa que se
        está exonerando**. Hacienda valida
        `MontoExoneracion = BaseImponible × TarifaExonerada / 100`.
        Exonerar el 100% de un IVA del 13% sobre ₡10.000 son **13** de tarifa y **₡1.300** de
        monto — *no* 100. La API deriva la tarifa del `montoExoneracion` que mandes, así que
        basta con que el monto sea correcto (si no cuadra → **-190**).

        Una exoneración **parcial** parte la base: exonerar la mitad de un IVA del 13% sobre
        ₡10.000 declara ₡5.000 gravados y ₡5.000 exonerados.

        Los emisores de **régimen simplificado** no trasladan IVA y por tanto no pueden
        exonerar (la API responde `422 exoneracion_no_aplica_simplificado`).
      properties:
        tipoDocumento:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '11'
            - '99'
          description: |
            Tipo de documento de exoneración (resolución MH-DGT-RES-0027-2024):

            | Código | Tipo |
            |---|---|
            | `01` | Compras autorizadas DGH |
            | `02` | Ventas exentas a diplomáticos |
            | `03` | Autorizado por Ley especial |
            | `04` | Exenciones DGH autorización especial |
            | `05` | Transitorio V (servicios ingeniería/arquitectura) |
            | `06` | Transitorio IX (turismo) |
            | `07` | Transitorio XVII |
            | `08` | Exoneración a Zona Franca |
            | `09` | Exoneración a servicios complementarios |
            | `10` | Órdenes especiales |
            | `11` | Régimen de turismo (Ley 6990) |
            | `99` | Otros (requiere `tipoDocumentoOTRO`) |
        numeroDocumento:
          type: string
          minLength: 3
          maxLength: 40
          description: Número del documento de exoneración tal como lo emitió la institución autorizante.
          example: AL-2026-00123
        fechaEmision:
          type: string
          format: date-time
          description: Fecha de emisión del **documento de exoneración**, no del comprobante. ISO 8601 con offset de Costa Rica (`-06:00`).
          example: '2026-01-10T10:00:00-06:00'
        nombreInstitucion:
          type: string
          maxLength: 160
          description: |
            Institución que emite la exoneración. Enviá el **código de 2 caracteres** (o un
            nombre que la API pueda resolver); si no está en la lista, usá `99` +
            `nombreInstitucionOtros`.

            | Código | Institución |
            |---|---|
            | `01` | Ministerio de Hacienda |
            | `02` | Ministerio de Relaciones Exteriores y Culto |
            | `03` | Ministerio de Agricultura y Ganadería |
            | `04` | Ministerio de Economía, Industria y Comercio |
            | `05` | Cruz Roja Costarricense |
            | `06` | Benemérito Cuerpo de Bomberos de Costa Rica |
            | `07` | Asociación Obras del Espíritu Santo |
            | `08` | Federación Cruzada Nacional de protección al Anciano (Fecrunapa) |
            | `09` | Escuela de Agricultura de la Región Húmeda (EARTH) |
            | `10` | Instituto Centroamericano de Administración de Empresas (INCAE) |
            | `11` | Junta de Protección Social (JPS) |
            | `12` | Autoridad Reguladora de los Servicios Públicos (Aresep) |
            | `99` | Otros (requiere `nombreInstitucionOtros`) |
        porcentajeExoneracion:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Qué porcentaje **del impuesto de la línea** se exonera: `100` para una exoneración total, `50` para la mitad. No confundir con la tarifa del IVA ni con `TarifaExonerada`.
          example: 100
        montoExoneracion:
          type: number
          minimum: 0
          description: |
            **Monto de IVA exonerado, en colones.** No es un porcentaje.

            Exonerar el 100 % de un IVA del 13 % sobre una base de 10 000 son **1 300**, no 100. La API deriva `TarifaExonerada` de este monto, así que basta con que el monto cuadre. No puede superar el IVA que la línea genera: si lo supera, la respuesta es `400` y le indica el máximo exacto.
          example: 1300
        articulo:
          type: integer
          minimum: 1
          description: Artículo de la norma que ampara la exoneración. **Obligatorio si `tipoDocumento` es 02, 03, 06, 07 u 08**; sin él Hacienda rechaza con `-478`.
          example: 8
        inciso:
          type: integer
          minimum: 1
          description: Inciso del artículo. Obligatorio siempre que envíe `articulo`.
          example: 2
        tipoDocumentoOTRO:
          type: string
          minLength: 5
          maxLength: 100
          description: Descripción del tipo de documento. **Obligatorio si `tipoDocumento` = 99.**
          example: Resolución administrativa especial
        nombreInstitucionOtros:
          type: string
          minLength: 5
          maxLength: 160
          description: Nombre de la institución. **Obligatorio si `nombreInstitucion` = 99.**
          example: Instituto Costarricense de Turismo
    Impuesto:
      type: object
      required:
        - codigo
      description: |
        Una línea lleva **dos cosas distintas**: el **IVA** (siempre, aunque el producto sea
        exento) y, opcionalmente, un **impuesto adicional** (combustible, licor, tabaco,
        cemento, selectivo…). El adicional NO reemplaza al IVA: lo acompaña como otro
        elemento del array.

        ⚠️ **Toda línea debe declarar un impuesto de la familia IVA (`01`, `07` u `08`)**,
        incluso si es exenta (usá `codigo: "01"` + `codigoTarifa: "10"`). Si no, Hacienda
        rechaza con **-513**.

        **Base imponible** (sobre la que se calcula el IVA):
        `BaseImponible = SubTotal + ISC(02) + Bebidas Alcohólicas(04) + Bebidas Envasadas(05) + Cemento(12)`.
        El combustible (`03`) y el tabaco (`06`) NO engrosan la base. Error aquí → **-454**.

        **Cobrado vs. asumido:** los códigos `03`, `04`, `05` y `12` ya los pagó el productor
        o importador y **viajan dentro del precio** — el comercio NO se los vuelve a cobrar al
        cliente: no suman al total ni aparecen en el desglose. El **tabaco (`06`) SÍ se cobra**
        (suma al total), aunque también sea por unidad.
      properties:
        codigo:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '12'
            - '99'
          description: |
            Catálogo de impuestos (no existen los códigos 09, 10 ni 11):

            | Código | Impuesto | Familia | Cómo se calcula el monto |
            |---|---|---|---|
            | `01` | Impuesto al Valor Agregado | **IVA** | Base imponible × tarifa |
            | `02` | Selectivo de Consumo (ISC) | ad-valorem | Subtotal × tarifa |
            | `03` | Único a los Combustibles | por unidad (asumido) | ₡ por litro |
            | `04` | Específico de Bebidas Alcohólicas | por unidad (asumido) | ₡ por mL de alcohol absoluto |
            | `05` | Bebidas envasadas sin alcohol y jabones | por unidad (asumido) | ₡ por unidad de consumo |
            | `06` | Productos de Tabaco | por unidad (**se cobra**) | ₡ por unidad |
            | `07` | IVA (cálculo especial) | **IVA** | Base imponible × tarifa |
            | `08` | IVA Régimen de Bienes Usados (Factor) | **IVA** | Requiere `factorIVA` |
            | `12` | Específico al Cemento | por unidad (asumido) | ₡ por saco · **`tarifa` obligatoria = 5** |
            | `99` | Otros | ad-valorem | Requiere `codigoTarifaOtro` |
        codigoTarifa:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '11'
          description: |
            Código de tarifa del IVA. Requerido para la familia IVA (`01`/`07`/`08`).

            | Código | Tarifa | |
            |---|---|---|
            | `01` | 0% | Artículo 32, num 1, RLIVA |
            | `02` | 1% | Reducida |
            | `03` | 2% | Reducida |
            | `04` | 4% | Reducida |
            | `05` | 0% | **Transitorio — solo NC/ND** |
            | `06` | 4% | **Transitorio — solo NC/ND** |
            | `07` | 8% | **Transitorio — solo NC/ND** |
            | `08` | 13% | **General** |
            | `09` | 0,5% | Reducida |
            | `10` | — | **Exenta** |
            | `11` | 0% | Sin derecho a crédito (no sujeta) |

            ⚠️ Las tarifas **transitorias (05, 06, 07)** solo valen en **notas de crédito y
            débito**. En Factura o Tiquete son rechazo seguro (**-505**). Para un 8% en una
            factura no hay código vigente.
        codigoTarifaOtro:
          type: string
          minLength: 5
          maxLength: 100
          description: Descripción del impuesto. **Obligatorio si `codigo` = 99**, mínimo 5 caracteres.
          example: Impuesto municipal específico
        tarifa:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Porcentaje del impuesto. **Requerido para la familia IVA** (`01`, `07`, `08`) y para el código `12` (cemento), donde además **debe ser exactamente 5**. Debe corresponder al `codigoTarifa` que envía: `08` → 13, `04` → 4, `10` → 0.
          example: 13
        factorIVA:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Factor del régimen de bienes usados, expresado como fracción (no porcentaje). **Requerido si `codigo` = 08.**
          example: 0.13
        monto:
          type: number
          minimum: 0
          description: |
            Monto del impuesto. **Normalmente omítalo**: la plataforma lo calcula y así evita descuadres, que son la causa más común de rechazo por `-45`. Envíelo solo si necesita forzar un valor concreto.
          example: 130
        datosImpuestoEspecifico:
          $ref: '#/components/schemas/DatosImpuestoEspecifico'
        exoneracion:
          $ref: '#/components/schemas/Exoneracion'
    LineItem:
      type: object
      required:
        - codigoCabys
        - cantidad
        - unidadMedida
        - detalle
        - precioUnitario
      properties:
        numeroLinea:
          type: integer
          minimum: 1
          maximum: 1000
          description: 'Número de la línea dentro del comprobante. **Omítalo**: se autogenera secuencialmente.'
          example: 1
        codigoCabys:
          type: string
          pattern: ^\d{13}$
          description: |
            Código CABYS de **13 dígitos** del catálogo del BCCR. Es obligatorio y hace dos cosas: clasifica la línea —primer dígito **1–5 = mercancía**, **6–9 = servicio**, y Hacienda re-deriva esa clasificación del CABYS— y determina la tarifa de IVA que le corresponde al producto.

            ⚠️ La API solo valida el **formato**. Un código de 13 dígitos que no exista en el catálogo pasa la validación, consume consecutivo y lo rechaza Hacienda con `-400`. Valídelo antes con `GET /catalogs/cabys?q={codigo}`.
          example: '2349002011500'
        codigoComercial:
          type: array
          maxItems: 5
          description: |
            Sus propios códigos de producto (SKU, código de barras, referencia interna). Viajan en el comprobante para que usted pueda reconciliarlo contra su inventario; Hacienda no los usa.
          items:
            $ref: '#/components/schemas/CodigoComercial'
        cantidad:
          type: number
          minimum: 0
          description: Cantidad vendida, en la unidad de `unidadMedida`. Admite decimales.
          example: 2
        unidadMedida:
          type: string
          maxLength: 15
          description: |
            Código de unidad del catálogo oficial: `Unid` (unidades), `Sp` (servicios profesionales), `kg`, `g`, `L`, `mL`, `m`, `m2`, `m3`, `h`, `d`, `Al` (alquiler), `Os` (otros servicios), entre otros.

            **Sensible a mayúsculas y no se valida contra el catálogo** (solo el largo), así que un typo viaja tal cual al XML. Regla práctica: `Sp` para servicios, `Unid` para mercancía que se cuenta, y la unidad física real cuando venda a granel.
          example: Unid
        unidadMedidaComercial:
          type: string
          maxLength: 20
          description: Su propia nomenclatura de unidad, si difiere de la oficial (ej. «Caja 12u»). Informativa.
          example: Bolsa 400g
        tipoVenta:
          type: string
          enum:
            - servicio
            - mercancia
          description: |
            **Omítalo**: se infiere del primer dígito del CABYS. Hacienda re-deriva la clasificación del CABYS de todos modos, así que si lo envía contradiciendo el código, gana el CABYS (y puede provocar `-111`).
          example: mercancia
        tipoTransaccion:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '11'
            - '12'
            - '13'
          description: |
            Nuevo en v4.4. Si se omite, se asume venta normal. ⚠️ Los tipos `08`/`09`/`10`
            determinan el crédito de IVA de tu cliente.

            | Código | Tipo de transacción |
            |---|---|
            | `01` | Venta normal de bienes y servicios |
            | `02` | Mercancía de autoconsumo exento |
            | `03` | Mercancía de autoconsumo gravado |
            | `04` | Servicio de autoconsumo exento |
            | `05` | Servicio de autoconsumo gravado |
            | `06` | Cuota de afiliación |
            | `07` | Cuota de afiliación exenta |
            | `08` | Bienes de capital para el emisor |
            | `09` | Bienes de capital para el receptor |
            | `10` | Bienes de capital para el emisor y el receptor |
            | `11` | Bienes de capital de autoconsumo exento para el emisor |
            | `12` | Bienes de capital sin contraprestación a terceros exento para el emisor |
            | `13` | Sin contraprestación a terceros |
        detalle:
          type: string
          minLength: 1
          maxLength: 200
          description: Descripción del bien o servicio, tal como el receptor la verá en el comprobante y en el PDF.
          example: Pan pita 400g
        precioUnitario:
          type: number
          minimum: 0
          description: |
            Precio por unidad **sin IVA**. El impuesto se calcula aparte, a partir del bloque `impuesto`; no incluya el IVA acá o lo cobrará dos veces.
          example: 1000
        montoTotal:
          type: number
          minimum: 0
          description: '`cantidad × precioUnitario`. **Omítalo**: lo calcula la plataforma.'
          example: 2000
        descuento:
          type: array
          maxItems: 5
          description: Hasta 5 descuentos sobre la línea. Se restan del subtotal **antes** de calcular el IVA.
          items:
            $ref: '#/components/schemas/Descuento'
        subtotal:
          type: number
          minimum: 0
          description: '`montoTotal` menos descuentos. **Omítalo**: lo calcula la plataforma.'
          example: 2000
        ivaCobradoFabrica:
          type: string
          enum:
            - '01'
            - '02'
          description: |
            Sistema especial de determinación del IVA en fábrica/mayorista/aduanas. **Omitir en
            el caso normal.**

            | Valor | Significado | Qué implica |
            |---|---|---|
            | `01` | El IVA ya se cobró en fábrica | Se declara como **asumido**: no suma al total ni va al desglose |
            | `02` | Venta **exenta** porque el bien ya soportó el impuesto | El IVA de la línea debe ir con **tarifa exenta** (`codigoTarifa: "10"`), o Hacienda rechaza con **-451** |
        baseImponible:
          type: number
          minimum: 0
          description: |
            Base sobre la que se calcula el IVA: subtotal más los específicos que la engrosan (ISC `02`, alcohol `04`, bebidas envasadas `05`, cemento `12`) — el combustible `03` y el tabaco `06` **no** la engrosan. **Omítala**: la calcula la plataforma, y equivocarse acá produce `-454`.
          example: 2000
        impuesto:
          type: array
          maxItems: 5
          description: |
            Impuestos de la línea. **Toda línea debe llevar uno de la familia IVA** (`01`, `07` u `08`), incluso si el producto es exento —en ese caso `codigoTarifa: "10"`—. Los específicos (combustible, licor, tabaco, cemento) se **añaden** como elementos adicionales del array; no reemplazan al IVA.

            ⚠️ Un array **vacío** o ausente pasa la validación local y lo rechaza Hacienda con `-1`, consumiendo consecutivo.
          items:
            $ref: '#/components/schemas/Impuesto'
        impuestoNeto:
          type: number
          minimum: 0
          description: 'Impuesto efectivamente cobrado en la línea (excluye los asumidos y lo exonerado). **Omítalo**: lo calcula la plataforma.'
          example: 260
        montoTotalLinea:
          type: number
          minimum: 0
          description: 'Total de la línea con impuestos. **Omítalo**: lo calcula la plataforma.'
          example: 2260
    LineItemExport:
      description: Línea de Factura de Exportación (añade partida arancelaria).
      allOf:
        - $ref: '#/components/schemas/LineItem'
        - type: object
          properties:
            partidaArancelaria:
              type: string
              pattern: ^\d{12}$
              description: Exactamente 12 dígitos.
    MedioPagoArray:
      type: array
      minItems: 1
      maxItems: 4
      description: |
        Medios de pago (1 a 4). Dos formas de enviarlos:

        - **Códigos simples** — `["01"]`. Para un solo medio (o cuando el monto no importa).
        - **Objetos con monto** — pago mixto: `[{"tipo":"01","monto":3000},{"tipo":"02","monto":2000}]`.

        Con **más de un medio**, cada objeto exige `monto` y la **suma debe igualar el total
        del comprobante** (si no: `MEDIO_PAGO_MONTO_REQUERIDO` / `MEDIO_PAGO_SUMA_INVALIDA`).

        | Código | Medio de pago |
        |---|---|
        | `01` | Efectivo |
        | `02` | Tarjeta |
        | `03` | Cheque |
        | `04` | Transferencia / depósito bancario |
        | `05` | Recaudado por terceros |
        | `06` | SINPE Móvil *(nuevo en v4.4)* |
        | `07` | Plataforma digital *(nuevo en v4.4 — PayPal, etc.)* |
        | `99` | Otros (requiere `otros`) |
      items:
        oneOf:
          - type: string
            enum:
              - '01'
              - '02'
              - '03'
              - '04'
              - '05'
              - '06'
              - '07'
              - '99'
            description: Código del medio de pago (ver tabla).
          - type: object
            required:
              - tipo
            properties:
              tipo:
                type: string
                enum:
                  - '01'
                  - '02'
                  - '03'
                  - '04'
                  - '05'
                  - '06'
                  - '07'
                  - '99'
              monto:
                type: number
                description: Obligatorio cuando hay más de un medio.
              otros:
                type: string
                maxLength: 100
                description: Descripción cuando tipo = 99.
    OtrosCargos:
      type: object
      required:
        - detalle
        - montoCargo
      description: Cargos adicionales al comprobante (timbres, propinas, fletes, cobros de terceros…). Máximo 15.
      properties:
        tipoDocumento:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '99'
          description: |
            | Código | Tipo de cargo |
            |---|---|
            | `01` | Contribución parafiscal |
            | `02` | Timbre de la Cruz Roja |
            | `03` | Timbre del Benemérito Cuerpo de Bomberos de Costa Rica |
            | `04` | Cobro de un tercero (**exige los datos del tercero**) |
            | `05` | Costos de exportación |
            | `06` | Impuesto de servicio 10% |
            | `07` | Timbre de Colegios Profesionales |
            | `08` | Depósitos de garantía |
            | `09` | Multas o penalizaciones |
            | `10` | Intereses moratorios |
            | `99` | Otros cargos (requiere `tipoDocumentoOtros`) |
        tipoDocumentoOtros:
          type: string
          description: Descripción del cargo. **Obligatorio si `tipoDocumento` = 99.**
          example: Cargo por manejo especial
        tipoIdentidadTercero:
          type: string
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
          description: |
            Tipo de identificación del tercero: 01 Física, 02 Jurídica, 03 DIMEX, 04 NITE, 05 Extranjero, 06 No contribuyente. **Obligatorio con `tipoDocumento` = 04** (cobro a favor de un tercero).
          example: '02'
        numeroIdentidadTercero:
          type: string
          maxLength: 20
          description: Cédula del tercero a cuyo favor se cobra. Obligatorio con `tipoDocumento` = 04.
          example: '3101456789'
        nombreTercero:
          type: string
          minLength: 5
          maxLength: 100
          description: Nombre del tercero. Obligatorio con `tipoDocumento` = 04.
          example: Transportes Unidos S.A.
        detalle:
          type: string
          maxLength: 160
          description: Descripción del cargo tal como la verá el receptor en el comprobante.
          example: Impuesto de servicio
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Porcentaje del cargo, cuando aplica (por ejemplo 10 en el impuesto de servicio). Es informativo: el monto que se cobra es siempre `montoCargo`.
          example: 10
        montoCargo:
          type: number
          minimum: 0
          description: |
            Monto del cargo en la moneda del comprobante. **Suma al total** del comprobante pero **no engrosa la base imponible del IVA** de las líneas.
          example: 1130
    Referencia:
      type: object
