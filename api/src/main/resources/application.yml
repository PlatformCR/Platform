spring:
  application:
    name: platform-api
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: http://localhost:5173
  session:
    ttl-hours: 24
  storage:
    local-path: ../data/uploads
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
