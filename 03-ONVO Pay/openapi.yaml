    CreateOneTimeLink:
      type: object
      properties:
        customerName:
            type: string
            description: Nombre completo del cliente para el primer paso de contacto.
            example: John Doe
        customerEmail:
            type: string
            format: email
            description: Correo electrónico del cliente para el primer paso de contacto.
            example: test@onvopay.com
        customerPhone:
            type: string
            description: "El número de teléfono del cliente, incluyendo código de área (Ej: +50688880000)"
            example: "+50688880000"
        redirectUrl:
          type: string
          description: La URL a la que se redirigirá al cliente en caso de que el pago sea exitoso.
          example: https://example.com/success
        cancelUrl:
          type: string
          description: La URL a la que se redirigirá al cliente en caso de que el pago sea cancelado.
          example: https://example.com/cancel
        officeId:
          type: string
          description: Identificador opcional de la sede a la que pertenece la sesión de Checkout.
          example: cl502zv0d0127ebdp3zt27651
        captureMethod:
          type: string
          description: Atributo opcional para indicar el tipo de captura que se desea realizar. Puede ser `manual` o `automatic`.
          example: automatic
          enum:
            - manual
            - automatic
        paymentMethodTypes:
          type: array
          description: Lista opcional de métodos de pago permitidos para la sesión.
          items:
            type: string
            enum:
              - card
              - mobile_number
              - zunify
              - bank_deposit
        discounts:
          type: array
          description: |
            Lista opcional de descuentos a aplicar a la sesión de Checkout. Para enlaces de un solo uso, enviá como máximo un descuento. Cada descuento debe incluir `coupon` o `promotionCode`, pero no ambos. No enviés `discounts` junto con `discountCouponIds`.
          maxItems: 1
          items:
            type: object
            properties:
              coupon:
                type: string
                description: Identificador único del cupón a aplicar. El cupón debe estar activo, pertenecer al mismo modo de la sesión, tener alcance `checkout_session` y aplicar a `one_time_links`.
                example: cpn_abc123
              promotionCode:
                type: string
                description: Identificador único del código promocional a aplicar. Debe pertenecer al mismo modo de la sesión y estar activo.
                example: promo_abc123
        discountCouponIds:
          type: array
          description: |
            Lista opcional de identificadores de cupones para integraciones existentes. Para nuevas integraciones preferí `discounts`. No enviés `discountCouponIds` junto con `discounts`.
          maxItems: 1
          items:
            type: string
          example:
            - cpn_abc123
        lineItems:
          type: array
          items:
            description: |
              Objeto que contiene los productos a asociar al one time link. Pueden ser
              productos existentes o nuevos. La lista debe tener al menos un elemento y
              todos los elementos deben ser en la misma moneda. Los atributos de cada producto
              son los siguientes:
              - `quantity`: Cantidad de productos.
              - `priceId`: Id del precio de un producto existente. Para monto abierto, creá un precio con `customUnitAmount` y enviá su `priceId` como único item con `quantity: 1`.
              - `unitAmount`: Monto del producto nuevo.
              - `currency`: Moneda del producto nuevo.
              - `description`: Descripción del producto nuevo.
            properties:
              quantity:
                type: integer
                description: Cantidad de productos.
                example: 1
              priceId:
                type: string
                description: Identificador único del precio asociado a un producto existente.
                example: "c19rabxd122264F1639pwn1f3"
              isQuantityAdjustable:
                type: boolean
                description: Indica si el cliente puede ajustar la cantidad desde Checkout.
                example: true
              minimumQuantity:
                type: integer
                description: Cantidad mínima permitida cuando `isQuantityAdjustable` está activo.
                example: 1
              maximumQuantity:
                type: integer
                description: Cantidad máxima permitida cuando `isQuantityAdjustable` está activo.
                example: 10
              unitAmount:
                type: integer
                description: |
                  El monto de precio unitario. Debe de ser un número entero positivo representando el monto en la menor denominación posible de la moneda (centavos para el caso de `USD` y céntimos para `CRC`).
                  Por ejemplo, si la moneda es `USD` y el monto a cobrar es $1.50, el valor indicado debe ser  `150`.
                  De igual forma, si la moneda es `CRC` y el monto a cobrar es ₡2,100.89, el valor indicado debe ser `210089`.
                  El monto mínimo es $0.50 para `USD` y el correspondiente equivalente en colones para `CRC`.
                example: 2099
              currency:
                type: string
                description: El tipo de moneda de precio.
                example: "USD"
                enum:
                  - USD
                  - CRC
                  - GTQ
                  - NIO
                  - PAB
                  - PEN
                  - MXN
                  - COP
                  - HNL
              description:
                type: string
                description: Texto arbitrario adjunto al objeto. Comúnmente útil para mostrar a usuarios.
                example: "Producto de prueba"
              priceType:
                type: string
                description: Tipo de precio del item. Puede ser `one_time` o `recurring`.
                example: one_time
                enum:
                  - one_time
                  - recurring
        metadata:
          type: object
          description: |
            Objeto opcional que puede ser utilizado para guardar información adicional sobre la sesión de Checkout. Puede ser útil para guardar información como el ID de una orden de compra, el ID de un carrito de compras, etc. Podés especificar hasta `50` pares de llave-valor. Las llaves y valores deben ser de tipo `string`. El nombre de las llaves debe de tener una longitud máxima de `40` caracteres y los valores una longitud máxima de `500` caracteres.
          readOnly: false
          example:
            {
              "orderId": "123456789",
              "cartId": "987654321"
            }
    CouponBinRule:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Identificador único de la regla de BIN.
          example: cbn_abc123
        bin:
          type: string
          description: Primeros 6 a 8 dígitos de la tarjeta que hacen elegible el descuento.
          pattern: "^\\d{6,8}$"
          example: "411111"
        issuerName:
          type: string
          description: Nombre opcional del emisor para identificar la regla en tus herramientas internas.
          example: Banco Sponsor
        cardBrand:
          type: string
          description: Marca opcional de la tarjeta asociada al BIN.
          example: visa
        isActive:
          type: boolean
          description: Indica si la regla de BIN está activa.
          default: true
          example: true
    CouponPromotionCode:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Identificador único del código promocional.
          example: promo_abc123
        code:
          type: string
          description: Código promocional asociado al cupón. ONVO lo almacena en mayúsculas.
          example: SUMMER25
        isActive:
          type: boolean
          description: Indica si el código promocional está activo.
          default: true
          example: true
        timesRedeemed:
          type: integer
          readOnly: true
          description: Cantidad de veces que el código promocional ha sido redimido.
          example: 0
    CouponRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Nombre interno del cupón. Se usa para identificarlo en el dashboard, reportes y respuestas de descuento.
          example: Banco Sponsor 10%
        isActive:
          type: boolean
          description: Indica si el cupón está activo y puede aplicarse.
          default: true
          example: true
        type:
          type: string
          description: Tipo de descuento. Usá `percentage` con `percentOff` o `fixed_amount` con `amountOff` y `currency`.
          enum:
            - fixed_amount
            - percentage
          example: percentage
        scope:
          type: string
          description: Alcance del cupón. Para enlaces de un solo uso usá `checkout_session`.
          default: checkout_session
          example: checkout_session
        appliesTo:
          type: array
          description: Superficies donde se puede usar el cupón. Para enlaces de un solo uso incluí `one_time_links`.
          items:
            type: string
          default:
            - one_time_links
          example:
            - one_time_links
        percentOff:
          type: number
          description: Porcentaje de descuento para cupones `percentage`. Debe ser mayor que `0` y menor o igual que `100`.
          minimum: 0
          maximum: 100
          example: 10
        amountOff:
          type: integer
          description: Monto fijo del descuento en la menor denominación de la moneda. Requerido para cupones `fixed_amount`.
          minimum: 0
          example: 250000
        currency:
          type: string
          description: Moneda del cupón de monto fijo. Debe coincidir con la moneda del enlace de pago.
          example: CRC
          enum:
            - USD
            - CRC
            - GTQ
            - NIO
            - PAB
            - PEN
            - MXN
            - COP
            - HNL
        maxRedemptions:
          type: integer
          description: Cantidad máxima de pagos exitosos que pueden consumir este cupón. Omitilo para no definir un límite.
          minimum: 0
          example: 100
        redeemBy:
          type: string
          format: date-time
          description: Fecha límite para redimir el cupón. Podés enviar una fecha ISO completa o una fecha `YYYY-MM-DD`; las fechas sin hora se normalizan a medianoche de Costa Rica.
          example: "2026-06-30"
        duration:
          type: string
          description: Duración del cupón. Para enlaces de un solo uso usualmente se usa `once` o se omite.
          enum:
            - once
            - repeating
            - forever
          example: once
        durationInMonths:
          type: integer
          description: Cantidad de meses cuando `duration` es `repeating`.
          minimum: 0
          example: 3
        binRules:
          type: array
          description: Reglas de BIN que hacen elegible el cupón cuando el comprador paga con una tarjeta cuyo BIN coincide.
          items:
            $ref: "#/components/schemas/CouponBinRule"
        promotionCodes:
          type: array
          description: Códigos promocionales iniciales a crear junto con el cupón.
          items:
            $ref: "#/components/schemas/CouponPromotionCode"
    Coupon:
      allOf:
        - $ref: "#/components/schemas/CouponRequest"
        - type: object
          properties:
            id:
              type: string
              readOnly: true
              description: Identificador único del cupón.
              example: cpn_abc123
            accountId:
              type: string
              readOnly: true
              description: Identificador único del negocio.
              example: acct_abc123
            mode:
              type: string
              readOnly: true
              description: El modo en el que existe el cupón. Puede ser `test` o `live`.
              enum:
                - test
                - live
              example: test
            timesRedeemed:
              type: integer
              readOnly: true
              description: Cantidad de pagos exitosos que han consumido este cupón.
              example: 0
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Fecha y hora en la que fue creado el cupón.
              example: 2026-05-13T18:25:43.511Z
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: Fecha y hora en la que fue actualizado por última vez el cupón.
              example: 2026-05-13T18:25:43.511Z
