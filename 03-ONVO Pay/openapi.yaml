    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único de la cuenta conectada.
        schema:
          type: string
    post:
      tags:
        - Marketplaces
      summary: Configurar una tarifa semanal
      description: |
        Crea o actualiza la tarifa fija semanal de una cuenta conectada. La Secret API Key determina la cuenta primaria y el modo `test` o `live`; el ID debe pertenecer a esa misma cuenta primaria y modo.

        Podés enviar uno o más campos. Para activar el cobro, la configuración efectiva debe incluir monto y moneda, y tanto la cuenta primaria como la conectada deben tener una cuenta bancaria de liquidación en esa moneda.

        Los valores `null` no están permitidos. Omití un campo para conservar su valor actual; cada solicitud actualiza la configuración de forma atómica.

        Cada viernes a las `02:00` en `America/Costa_Rica`, ONVO crea la obligación si la tarifa está habilitada y la cuenta conectada está activa. Deshabilitarla detiene obligaciones futuras, pero no elimina saldos pendientes.
      security:
        - SecretApiKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfigureConnectedAccountWeeklyFee"
      responses:
        "200":
          description: Tarifa semanal configurada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountWeeklyFee"
        "400":
          description: Payload inválido o la tarifa semanal no cumple los requisitos de configuración.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MarketplaceValidationError"
                  - $ref: "#/components/schemas/MarketplaceAPIError"
              examples:
                payloadInvalido:
                  summary: Monto inválido
                  value:
                    statusCode: 400
                    message:
                      - marketplaceWeeklyFeeAmount must be an integer number
                    error: Bad Request
                valorNulo:
                  summary: Valores nulos no permitidos
                  value:
                    statusCode: 400
                    message:
                      - marketplaceWeeklyFeeEnabled must be a boolean value
                    error: Bad Request
                configuracionRequerida:
                  summary: No se enviaron campos
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.weekly_fee.configuration_required
                    message: At least one weekly marketplace fee configuration field is required
                    path: /v1/connected-accounts/cl502zv0d0127ebdp3zt27651/weekly-fees
                    timestamp: 2026-07-25T17:00:00.000Z
                montoRequerido:
                  summary: Falta el monto para activar la tarifa
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.weekly_fee.amount_required
