            - default_incomplete
        startDate:
          type: string
          description: |
            Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8901" target="_blank">ISO 8901</a> y con zona
            horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se desea que se inicie el cargo recurrente. Si no se envía, el cargo recurrente se iniciará en el momento en que el cliente realice el pago de forma satisfactoria.
            Este atributo no es compatible si `paymentBehavior` es `allow_incomplete`.
          example: 2026-01-10T21:21:10.587Z
        paymentMethodId:
          type: string
          description: Identificador único del método de pago asociado al cargo recurrente. Si `paymentBehavior` es diferente a `allow_incomplete`, este atributo es obligatorio.
          example: cl502zv0d0127ebdp3zt27651
        trialPeriodDays:
          type: integer
          description: El número de días de prueba que se desean brindar al cliente.
          example: 7
    ShippingRate:
      type: object
      properties:
        id:
          type: string
          description: Identificador único del objeto.
          readOnly: true
          example: cl502zv0d0127ebdp3zt27651
        createdAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue creado el objeto.
          readOnly: true
          example: 2022-06-12T21:21:10.587Z
        amount:
          type: number
          description: El monto, en centavos, del precio de la tarifa de envío. Por ejemplo, si el precio de la tarifa de envío es de $10.00, el atributo deberá ser `1000`. Si se envía `amount` como `0`, el precio de la tarifa de envío será mostrada como `gratis`.
          example: 1000
          minimum: 0
        currency:
          type: string
          description: La moneda en la que se define el monto del envío.
          example: USD
          enum:
            - USD
            - CRC
            - GTQ
            - NIO
            - PAB
            - PEN
            - MXN
            - COP
            - HNL
        displayName:
          type: string
          description: El nombre que se mostrará en la tarifa de envío.
          example: Envío a domicilio al siguiente día.
        isActive:
          type: boolean
          default: true
          description: Indica si el envío está activo. Si es `false`, el envío no se podrá utilizar para generar una compra.
          example: true
        deliveryEstimate:
          type: object
          description: El período de tiempo estimado para la entrega del envío.
          properties:
            minimumUnit:
              type: string
              description: El tipo de unidad de tiempo estimado para la entrega del envío.
              example: days
              enum:
                - hour
                - day
                - business_day
                - week
                - month
            minimumValue:
              type: integer
              description: El número de unidades de tiempo estimado para la entrega del envío. Por ejemplo, si se envía `minimumUnit` como `day` y `minimumValue` como `2`, el período de tiempo estimado para la entrega del envío será de dos días.
              example: 2
              minimum: 1
            maximumUnit:
              type: string
              description: El tipo de unidad de tiempo estimado para la entrega del envío.
              example: days
              enum:
                - hour
                - day
                - business_day
                - week
                - month
            maximumValue:
              type: integer
              description: El número de unidades de tiempo estimado para la entrega del envío. Por ejemplo, si se envía `minimumUnit` como `day` y `minimumValue` como `2`, el período de tiempo estimado para la entrega del envío será de dos días.
              example: 2
              minimum: 1
        updatedAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue actualizado por última vez el objeto.
          readOnly: true
          example: 2022-06-12T21:21:10.587Z
    OneClick:
      type: object
      properties:
        consumer:
          type: object
          description: El objeto con la información del comprador un solo click.
          properties:
            id:
              type: string
              description: Identificador único del objeto.
              readOnly: true
              example: cl502zv0d0127ebdp3zt27651
            email:
              type: string
              format: email
              description: La dirección de correo electrónico del comprador.
              example: "john.doe@onvopay.com"
            fullName:
              type: string
              description: Nombre completo del comprador.
              readOnly: true
              example: "John Doe"
            phone:
              type: string
              description: "El número de teléfono del comprador, incluyendo código de área (Ej: +50688880000)"
              example: "+50688880000"
            redactedPhone:
              type: string
              description: "El número de teléfono protegido del comprador (Ej: +5********00)"
              example: "+5********00"
            countryId:
              type: string
              description: El código de país en dos caracteres (<a href="https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2" target="_blank">ISO 3166-1 alpha-2</a>).
              example: "CR"
            createdAt:
              type: string
              description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue creado el objeto.
              readOnly: true
              example: 2022-06-12T21:21:10.587Z
            updatedAt:
              type: string
              description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue actualizado el objeto.
              readOnly: true
              example: 2022-06-12T21:21:10.587Z
            shipping:
              type: object
              description: La dirección de entrega a domicilio del comprador.
              properties:
                address:
                  type: object
                  description: La dirección del cliente.
                  properties:
                    city:
                      type: string
                      description: Nombre de ciudad o pueblo.
                      example: null
                    country:
                      type: string
                      description: El código de país en dos caracteres (<a href="https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2" target="_blank">ISO 3166-1 alpha-2</a>).
                      example: "CR"
                    line1:
                      type: string
                      description: "Primera línea de la dirección. (Ej: Calle, nombre de empresa)."
                      example: null
                    line2:
                      type: string
                      description: "Segunda línea de la dirección. (Ej: Edificio, apartamento, número de casa)."
                      example: null
                    postalCode:
                      type: string
                      description: Código postal o código ZIP.
                      example: null
                    state:
                      type: string
                      description: Estado, provincia o región.
                      example: null
        session:
          type: object
          description: El objeto con la información de la sesión del comprador.
          properties:
            id:
              type: string
              description: Identificador único del objeto.
              readOnly: true
              example: cl502zv0d0127ebdp3zt27651
            consumerId:
              type: string
              description: Identificador único del comprador.
              readOnly: true
              example: cl502zv0d0127ebdp3zt27651
            secret:
              type: string
              description: Llave secreta de la sesión.
              readOnly: true
              example: 609c2997f5cf346b1ebcf24e17e3f9ad932d943318f969f5b721
            status:
              type: string
              description: El estado de la sesión. Puede ser `started` o `verified`.
              example: verified
              enum:
                - started
                - verified
            type:
              type: string
              description: El método que se uso para verificar la sesión. Puede ser `email` o `sms`.
              example: sms
              enum:
                - email
                - sms
            expiresAt:
              type: string
              description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que expira la sesión.
              readOnly: true
              example: 2022-06-12T21:21:10.587Z
            createdAt:
              type: string
              description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue creado el objeto.
              readOnly: true
              example: 2022-06-12T21:21:10.587Z
            updatedAt:
              type: string
              description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue actualizado el objeto.
              readOnly: true
              example: 2022-06-12T21:21:10.587Z
  requestBodies:
    CreateConnectedAccount:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - businessName
            properties:
              businessName:
                type: string
                minLength: 1
                maxLength: 50
                description: Nombre comercial del vendedor. ONVO elimina espacios al inicio y al final.
                example: Tienda Conectada
              marketplaceAppFee:
                type: number
                format: double
                minimum: 0
                maximum: 100
                multipleOf: 0.01
                description: Porcentaje de comisión del marketplace, con un máximo de dos decimales. Si se omite, ONVO guarda y retorna `0`.
                example: 5
          examples:
            default:
              summary: Crear una cuenta conectada
              value:
                businessName: Tienda Conectada
                marketplaceAppFee: 5
    UpdateConnectedAccount:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              businessName:
                type: string
                minLength: 1
                maxLength: 50
                description: Nuevo nombre comercial del vendedor. ONVO elimina espacios al inicio y al final.
                example: Tienda Conectada Actualizada
              marketplaceAppFee:
                type: number
                format: double
                minimum: 0
                maximum: 100
                multipleOf: 0.01
                description: Nuevo porcentaje de comisión del marketplace, con un máximo de dos decimales.
                example: 6.25
          examples:
            default:
              summary: Actualizar una cuenta conectada
              value:
                businessName: Tienda Conectada Actualizada
                marketplaceAppFee: 6.25
    ConfigureConnectedAccountWeeklyFee:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              marketplaceWeeklyFeeEnabled:
                type: boolean
                description: Activa o desactiva el cobro semanal. Para activarlo, la configuración efectiva debe incluir monto y moneda.
                example: true
              marketplaceWeeklyFeeAmount:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: Monto semanal en la unidad menor de la moneda.
                example: 1000
              marketplaceWeeklyFeeCurrency:
                type: string
                description: Moneda en la que se cobra la tarifa. Debe estar soportada para el país de la cuenta conectada.
                enum:
                  - USD
                  - CRC
                  - GTQ
                  - PEN
                example: CRC
          examples:
            activar:
              summary: Activar una tarifa semanal
              value:
                marketplaceWeeklyFeeEnabled: true
                marketplaceWeeklyFeeAmount: 1000
                marketplaceWeeklyFeeCurrency: CRC
            desactivar:
              summary: Desactivar una tarifa semanal
              value:
                marketplaceWeeklyFeeEnabled: false
