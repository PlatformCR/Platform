  /v1/payment-methods:
    post:
      tags:
        - Métodos de pago
      summary: Crear un Método de pago
      description: |
        Consultá la documentación de ONVO para ver detalles de integración y ejemplos.

        Para evitar errores `400` de validación al enviar `card`, validá que `card.holderName` sea texto no vacío, `card.number` sea un string de dígitos sin espacios ni separadores y que pase Luhn, `card.expMonth` sea un entero entre `1` y `12`, `card.expYear` sea un entero entre `2023` y `2100`, y `card.cvv` sea un string de `3` o `4` dígitos cuando lo enviés.

        Para cuentas de comercio creadas en Perú, el cliente asociado al método de pago debe tener correo electrónico al crear métodos de pago. Podés enviar `customer.email` en el payload para crear y asociar el cliente en la misma solicitud, o enviar `customerId` de un cliente creado previamente con el atributo `email`.

        Cuando creás un método de pago de tipo `card`, ONVO tokeniza y verifica la tarjeta antes de crear el objeto. Si la tokenización falla por datos inválidos, el endpoint responde `400` con `code: "cards.invalid_card_info"` y no se crea ningún método de pago.
      security:
        - PublishableApiKey: []
        - SecretApiKey: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodResponse"

          description: "Success"
        "400":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/OnvoAPIError"
              examples:
                tokenizacionTarjetaFallida:
                  summary: Tokenización de tarjeta fallida
                  value:
                    code: cards.invalid_card_info
                    path: /v1/payment-methods
                    type: OnvoAPIError
                    message: There was an error with the card information provided. Please review card number, expiration date and cvv
                    timestamp: 2026-04-29T17:36:28.477Z
                    statusCode: 400
                validacionFallida:
                  summary: Validación fallida
                  value:
                    statusCode: 400
                    message:
                      - "address.country must be a valid ISO31661 Alpha2 code"
                    error: Bad Request
                validacionTarjetaFallida:
                  summary: Validación de tarjeta fallida
                  value:
                    statusCode: 400
                    message:
                      - "card.number Card number is invalid"
                    error: Bad Request
          description: "Solicitud inválida. Al crear un método de pago de tipo `card`, también puede indicar que la tokenización de la tarjeta falló."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: "Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
          description: "Forbidden"

