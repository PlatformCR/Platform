        type:
          type: string
          description: |
            El tipo de método de pago. Puede ser uno de los siguientes:
            - Tarjetas de crédito/débito VISA o MASTERCARD: `card`
            - SINPE Móvil: `mobile_number`
            - Depósito Bancario (SINPE PIN): `bank_deposit`
            - CREDIX: `credix`
