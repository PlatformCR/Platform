        - lang: "C#"
          source: |
            using System;
            using System.Net.Http;
            using System.Net.Http.Headers;
            using System.Text;
            using Newtonsoft.Json;
            using Newtonsoft.Json.Linq;
            using System.Collections.Generic;
            using System.Threading.Tasks;
            namespace OnvopaySamples
            {
                public class PaymentMethods
                {
                    public static async Task<string> CreatePaymentMethod()
                    {
                        var client = new HttpClient();
                        client.DefaultRequestHeaders.Accept.Clear();
                        client.DefaultRequestHeaders.Accept.Add(new MediaTypeWithQualityHeaderValue("application/json"));
                        client.DefaultRequestHeaders.Add("Authorization", "Bearer <YOUR_API_KEY>");
                        var data = new Dictionary<string, object>();
                        data.Add("type", "card");
                        data.Add("card", new Dictionary<string, object>());
                        data["card"].Add("number", "4242424242424242");
                        data["card"].Add("expMonth", 12);
                        data["card"].Add("expYear", 2026);
                        data["card"].Add("cvv", "123");
                        data["card"].Add("holderName", "John Doe");
                        data.Add("billing", new Dictionary<string, object>());
                        data["billing"].Add("address", new Dictionary<string, object>());
                        data["billing"]["address"].Add("country", "CR");
                        data["billing"].Add("name", "John Doe");
                        data["billing"].Add("phone", "+50688880000");
                        var json = JsonConvert.SerializeObject(data);
                        var content = new StringContent(json, Encoding.UTF8, "application/json");
                        var response = await client.PostAsync("https://api.onvopay.com/v1/payment-methods", content);
                        var responseString = await response.Content.ReadAsStringAsync();
                        return responseString;
                    }
                }
            }
