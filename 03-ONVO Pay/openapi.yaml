        card:
          type: object
          description: "La información sobre la tarjeta de crédito o débito. Cuando el tipo de método de pago sea `card`, este objeto será requerido."
          required:
            - number
            - expMonth
            - expYear
            - holderName
          properties:
            number:
              type: string
              pattern: "^[0-9]+$"
              description: El número de la tarjeta. Enviá solo dígitos, sin espacios ni separadores. El número también debe pasar validación Luhn.
              example: "4242424242424242"
            expMonth:
              type: integer
              minimum: 1
              maximum: 12
              description: El mes de expiración de la tarjeta.
              example: 12
            expYear:
              type: integer
              minimum: 2023
              maximum: 2100
              description: El año de expiración de la tarjeta en cuatro dígitos.
              example: 2026
            cvv:
              type: string
              pattern: "^[0-9]{3,4}$"
              description: El código de seguridad de la tarjeta. Si lo enviás, debe contener 3 o 4 dígitos.
              example: "123"
            holderName:
              type: string
              minLength: 1
              description: El nombre del titular de la tarjeta.
              example: "John Doe"
