paths:
  /v1/connected-accounts:
    post:
      tags:
        - Marketplaces
      summary: Crear una cuenta conectada
      description: |
        Crea una cuenta conectada para un vendedor desde una cuenta primaria estándar. Autenticá la solicitud con la Secret API Key de la cuenta primaria; la llave determina la cuenta propietaria y el modo `test` o `live`.

        La respuesta incluye el objeto público de la cuenta y el `onboardingUrl` alojado por ONVO. El vendedor debe completar ese flujo antes de operar.
      security:
        - SecretApiKey: []
      requestBody:
        $ref: "#/components/requestBodies/CreateConnectedAccount"
      responses:
        "201":
          description: Cuenta conectada creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountCreateResponse"
        "400":
          description: Payload inválido, campo no soportado o configuración inválida de la cuenta primaria.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MarketplaceValidationError"
                  - $ref: "#/components/schemas/MarketplaceAPIError"
              examples:
                payloadInvalido:
                  summary: Payload inválido
                  value:
                    statusCode: 400
                    message:
                      - businessName must be longer than or equal to 1 characters
                    error: Bad Request
                configuracionPrimariaInvalida:
                  summary: Configuración inválida de la cuenta primaria
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.parent_configuration_invalid
                    message: The parent account is not configured to manage connected accounts
                    path: /v1/connected-accounts
                    timestamp: 2026-07-25T17:00:00.000Z
                campoPublicoNoSoportado:
                  summary: Campo no soportado por la API pública
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.unsupported_public_field
                    message: The request contains fields that cannot be updated through the API
                    path: /v1/connected-accounts
                    timestamp: 2026-07-25T17:00:00.000Z
        "401":
          description: Secret API Key inválida, Publishable API Key no permitida o llave live de una cuenta primaria inactiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "500":
          description: Falló la creación del enlace de onboarding. La transacción no deja una cuenta conectada parcial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAPIError"
              examples:
                enlaceNoCreado:
                  summary: No se pudo crear el enlace de onboarding
                  value:
                    statusCode: 500
                    type: OnvoAPIError
                    code: marketplaces.error_creating_onboarding_link
                    message: There was an error creating the onboarding link
                    path: /v1/connected-accounts
                    timestamp: 2026-07-25T17:00:00.000Z
    get:
      tags:
        - Marketplaces
      summary: Listar cuentas conectadas
      description: |
        Lista únicamente las cuentas conectadas que pertenecen a la cuenta primaria y al modo de la Secret API Key. Los parámetros `startingAfter` y `endingBefore` son mutuamente excluyentes y cada cursor debe pertenecer al mismo conjunto de cuenta, modo, tipo y filtro.

        La respuesta usa el envelope `{ data, meta }`. `onboardingUrl` nunca aparece en este listado.
      security:
        - SecretApiKey: []
      parameters:
        - name: status
          in: query
          description: Estado exacto de la cuenta conectada. `restricted` no forma parte del contrato de Secret API Key.
          schema:
            type: string
            enum:
              - pending_onboarding
              - awaiting_approval
              - active
              - inactive
              - temporally_suspended
              - permanently_suspended
              - deleted
        - name: startingAfter
          in: query
          description: Cursor retornado en `meta.cursorNext`. No lo enviés junto con `endingBefore`.
          schema:
            type: string
        - name: endingBefore
          in: query
          description: Cursor retornado en `meta.cursorBefore`. No lo enviés junto con `startingAfter`.
          schema:
            type: string
        - name: limit
          in: query
          description: Cantidad máxima de cuentas conectadas por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Lista paginada de cuentas conectadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountList"
        "400":
          description: Filtro, límite o combinación de cursores inválida.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MarketplaceValidationError"
                  - $ref: "#/components/schemas/MarketplaceAPIError"
              examples:
                limiteInvalido:
                  summary: Límite inválido
                  value:
                    statusCode: 400
                    message:
                      - limit must not be greater than 100
                    error: Bad Request
                cursorInvalido:
                  summary: Cursor inválido o ajeno
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.invalid_cursor
                    message: The connected account pagination cursor is invalid
                    path: /v1/connected-accounts
                    timestamp: 2026-07-25T17:00:00.000Z
                estadoInvalido:
                  summary: Estado no soportado
                  value:
                    statusCode: 400
                    type: OnvoInvalidRequestError
                    code: marketplaces.invalid_status
                    message: The connected account status filter is invalid
                    path: /v1/connected-accounts
                    timestamp: 2026-07-25T17:00:00.000Z
        "401":
          description: Secret API Key inválida, Publishable API Key no permitida o llave live de una cuenta primaria inactiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
  /v1/connected-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único de la cuenta conectada.
        schema:
          type: string
    get:
      tags:
        - Marketplaces
      summary: Obtener una cuenta conectada
      description: |
        Retorna el objeto público de una cuenta conectada que pertenece a la cuenta primaria y al modo de la Secret API Key. Un ID inexistente, de otra cuenta primaria o de otro modo produce la misma respuesta `404`.

