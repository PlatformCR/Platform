  /v1/invoices:
    get:
      tags:
        - Renovaciones
      summary: Listar renovaciones
      description: |-
        Lista las renovaciones de la cuenta. Las renovaciones representan cada período de cobro de un cargo recurrente. ONVO crea una renovación al inicio de la suscripción y en cada renovación exitosa. Cada renovación está asociada a una intención de pago y permite consultar el cobro que corresponde a ese período.

        Ejemplos de URLs:
        - Paginación: `GET /v1/invoices?limit=25&startingAfter=cl40muorw00493ndp0okzk2g3`
        - Filtrar por cliente y estado: `GET /v1/invoices?customerId=cl40muorw00493ndp0okzk2g3&status=paid`
        - Filtrar por varios estados: `GET /v1/invoices?status=open,paid`
        - Filtrar por rango de fechas: `GET /v1/invoices?createdAt[gte]=2026-01-01T00:00:00.000Z&createdAt[lte]=2026-01-31T23:59:59.999Z`
        - Filtrar por rango de montos: `GET /v1/invoices?total[gte]=1000&total[lte]=5000`
        - Filtrar por metadata: `GET /v1/invoices?metadata[key]=orderId&metadata[value]=order_123`
        - Expandir objetos relacionados: `GET /v1/invoices?expand=payment_intent&expand=subscription`

        Si construís la URL manualmente, podés escribir filtros con corchetes como `createdAt[gte]` y `metadata[key]`. Los clientes HTTP suelen codificarlos como `createdAt%5Bgte%5D` y `metadata%5Bkey%5D` al enviar la solicitud.
      security:
        - SecretApiKey: []
      parameters:
        - name: subscriptionId
          in: query
          description: Identificador único del cargo recurrente asociado a la renovación.
          example: cl40muorw00493ndp0okzk2g3
          schema:
            type: string
        - name: paymentIntentId
          in: query
          description: Identificador único de la intención de pago asociada a la renovación.
          example: cl40muorw00493ndp0okzk2g3
          schema:
            type: string
        - name: customerId
          in: query
          description: Identificador único del cliente asociado a la renovación.
          example: cl40muorw00493ndp0okzk2g3
          schema:
            type: string
        - name: status
          in: query
          description: Estado de la renovación. Podés enviar uno o varios estados separados por coma.
          example: paid
          schema:
            type: string
            enum:
              - draft
              - open
              - paid
              - void
              - uncollectible
        - name: currency
          in: query
          description: Moneda de la renovación.
          example: USD
          schema:
            type: string
            enum:
              - USD
              - CRC
              - GTQ
              - NIO
              - PAB
              - PEN
              - MXN
              - COP
              - HNL
        - name: createdAt[lt]
          in: query
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, que filtra los resultados donde `createdAt` es menor que el valor especificado.
          example: 2022-06-12T21:21:10.587Z
          schema:
            format: date-time
            type: string
        - name: createdAt[lte]
          in: query
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, que filtra los resultados donde `createdAt` es menor o igual que el valor especificado.
          example: 2022-06-12T21:21:10.587Z
          schema:
            format: date-time
            type: string
        - name: createdAt[gt]
          in: query
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, que filtra los resultados donde `createdAt` es mayor que el valor especificado.
          example: 2022-06-12T21:21:10.587Z
          schema:
            format: date-time
            type: string
        - name: createdAt[gte]
          in: query
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, que filtra los resultados donde `createdAt` es mayor o igual que el valor especificado.
          example: 2022-06-12T21:21:10.587Z
          schema:
            format: date-time
            type: string
        - name: total[gte]
          in: query
          description: Monto mínimo total de la renovación en centavos.
          example: 1000
          schema:
            type: number
        - name: total[lte]
          in: query
          description: Monto máximo total de la renovación en centavos.
          example: 5000
          schema:
            type: number
        - name: metadata[key]
          in: query
          description: Llave de metadata para filtrar renovaciones.
          example: orderId
          schema:
            type: string
        - name: metadata[value]
          in: query
          description: Valor de metadata para filtrar renovaciones.
          example: order_123
          schema:
            type: string
        - name: endingBefore
          in: query
          description: "Un cursor usado para paginación. Corresponde al ID de un objeto existente."
          example: cl40muorw00493ndp0okzk2g3
          schema:
            type: string
        - name: limit
          in: query
          description: "Un límite en la cantidad de objetos a retornar. Puede ser un valor entre 1 y 100, el valor por defecto es 25."
          example: 25
          schema:
            type: number
        - name: startingAfter
          in: query
          description: "Un cursor usado para paginación. Corresponde al ID de un objeto existente."
          example: cl40muorw00493ndp0okzk2g3
          schema:
            type: string
        - name: expand
          in: query
          description: "Permite expandir objetos relacionados. Valores soportados: `payment_intent` y `subscription`."
          example: payment_intent
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
          description: "OK"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
          description: "Bad Request"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: "Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
          description: "Forbidden"
      x-codeSamples:
        - lang: "JS"
          source: |
            const params = new URLSearchParams();
            params.set('limit', '25');
            params.set('status', 'paid');
            params.set('customerId', 'cl40muorw00493ndp0okzk2g3');
            params.set('createdAt[gte]', '2026-01-01T00:00:00.000Z');
            params.set('createdAt[lte]', '2026-01-31T23:59:59.999Z');
            params.set('metadata[key]', 'orderId');
            params.set('metadata[value]', 'order_123');
            params.append('expand', 'payment_intent');
            params.append('expand', 'subscription');

            fetch(`https://api.onvopay.com/v1/invoices?${params.toString()}`, {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer <YOUR_API_KEY>'
              }
            })
        - lang: "Shell"
          source: |
            curl -G 'https://api.onvopay.com/v1/invoices' \
              -H 'Authorization: Bearer <YOUR_API_KEY>' \
              --data-urlencode 'limit=25' \
              --data-urlencode 'status=paid' \
              --data-urlencode 'customerId=cl40muorw00493ndp0okzk2g3' \
              --data-urlencode 'createdAt[gte]=2026-01-01T00:00:00.000Z' \
              --data-urlencode 'createdAt[lte]=2026-01-31T23:59:59.999Z' \
              --data-urlencode 'metadata[key]=orderId' \
              --data-urlencode 'metadata[value]=order_123' \
              --data-urlencode 'expand=payment_intent' \
              --data-urlencode 'expand=subscription'
        - lang: "Python"
          source: |
            import requests

            headers = {
              'Authorization': 'Bearer <YOUR_API_KEY>'
            }

            params = {
              'limit': 25,
              'status': 'paid',
              'customerId': 'cl40muorw00493ndp0okzk2g3',
              'createdAt[gte]': '2026-01-01T00:00:00.000Z',
              'createdAt[lte]': '2026-01-31T23:59:59.999Z',
              'metadata[key]': 'orderId',
              'metadata[value]': 'order_123',
              'expand': ['payment_intent', 'subscription']
            }

            response = requests.get(
              'https://api.onvopay.com/v1/invoices',
              headers=headers,
              params=params
            )

            print(response.json())
