                        enum:
                          - test
                          - live
                      isActive:
                        type: boolean
                        readOnly: true
                        default: true
                        description: Indica si el precio está activo.
                        example: true
              quantity:
                type: integer
                description: Cantidad de productos.
                example: 10
              priceId:
                type: string
                description: Identificador único del precio asociado a un producto existente.
                example: 10
              unitAmount:
                type: integer
                description: |
                  El monto de precio unitario. Debe de ser un número entero positivo representando el monto en la menor denominación posible de la moneda (centavos para el caso de `USD` y céntimos para `CRC`).
                  Por ejemplo, si la moneda es `USD` y el monto a cobrar es $1.50, el valor indicado debe ser  `150`.
                  De igual forma, si la moneda es `CRC` y el monto a cobrar es ₡2,100.89, el valor indicado debe ser `210089`.
                  El monto mínimo es $0.50 para `USD` y el correspondiente equivalente en colones para `CRC`.
                example: 2099
              currency:
                type: string
                description: El tipo de moneda de precio.
                example: "USD"
                enum:
                  - USD
                  - CRC
                  - GTQ
                  - NIO
                  - PAB
                  - PEN
                  - MXN
                  - COP
                  - HNL
              description:
                type: string
                description: Texto arbitrario adjunto al objeto. Comúnmente útil para mostrar a usuarios.
                example: "Producto de prueba"
        mode:
          type: string
          description: El modo en el que existen los datos del objeto. Ya sea `test` o `live`.
          readOnly: true
          enum:
            - test
            - live
        shippingAddressCollection:
          type: boolean
          description: Bandera que indica si existe una lista de direcciones de facturación del método de pago.
          readOnly: true
          example: true
        shippingCountries:
          type: array
          readOnly: true
          description: |
            Objeto que contiene la lista de paises de envío.
          example: []
        shippingRates:
          type: array
          readOnly: true
          description: |
            Objeto que contiene la lista de tarifase de envío.
          example: []
        paymentStatus:
          type: string
          readOnly: true
          description: El estado actual de la Sesión de Checkout. Al momento de crearse, inicia con status `unpaid`  y, una vez que el pago sea satisfactorio, pasa a status `paid`.
          example: "unpaid"
          enum:
            - paid
            - unpaid
        paymentIntentId:
          type: string
          description: Identificador único del intento de pago.
          readOnly: true
          example: "clcl69c7m0011jhtrfs04kwfw"
        account:
          type: object
          readOnly: true
          description: |
            Objeto que contiene los detalles del negocio para el cual el One Time Link es creado.
    Subscription:
      type: object
      properties:
        id:
          type: string
          description: Identificador único del objeto.
          readOnly: true
          example: cl502zv0d0127ebdp3zt27651
        billingCycleAnchor:
          type: string
          format: date-time
          description: |
            La fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se desea que se genere el ciclo de facturación, si se desea que 
            el ciclo de facturación no se inicie en la fecha y hora en la que el cliente se suscribe, sino en la fecha y hora indicada en este atributo. Por ejemplo, si se desea que el ciclo de facturación del cargo recurrente sea los 15 de cada mes, al indicar esa fecha en este atributo, ONVO determinará
            cuánto debe pagar el cliente al momento de la transacción, con base en los días restantes a la fecha indicada y siguiente cobro será el 15 de dicho mes y así ya quedará fijado.

            Si no se indica ninguna fecha, el ciclo de facturación se iniciará en el momento en que el cliente se realice el pago de forma satisfactoria.
          example: 2022-09-31T00:00:00.000Z
        status:
          type: string
          readOnly: true
          description: El estado actual de la suscripción. Puede ser `active`, `past_due`, `canceled`, `unpaid`, `incomplete`, `incomplete_expired`, `trialing`.
          example: "trialing"
          enum:
            - active
            - past_due
            - canceled
            - unpaid
            - incomplete
            - incomplete_expired
            - trialing
        cancelAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se desea que se cancele el cargo recurrente.
            Esta fecha debera ser mayor a la fecha actual y podria generar diferentes escenarios que se detallan a continuación.

            - Si se usa una fecha menor al inicio del siguiente ciclo de facturación, se cancelara el cargo recurrente inmediatamente, sin generar un nuevo monto a cobrar.

            - Si se usa una fecha menor a la finalización del siguiente período, al ejecutar el ciclo de facturación, se cancelara el cargo recurrente, pero además un nuevo monto sera calculado, utilizando el costo diario calculado y la cantidad de días diferencia generados por la fecha de cancelación.

            - Si se usa una fecha mayor a la finalización del siguiente período, se ejecutara el ciclo de facturación actual, pero además un nuevo monto sera calcualdo para el siguiente ciclo de facturación, esto basado en el costo diario calculado y la cantidad de días diferencia generados por la fecha de cancelación.
          example: 2022-06-12T21:21:10.587Z
        cancelAtPeriodEnd:
          type: boolean
          description: Indica si el cargo recurrente se cancela al finalizar el período de facturación. El valor por defecto es `false`.
          example: true
        canceledAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se canceló el cargo recurrente.
          example: 2022-06-12T21:21:10.587Z
          readOnly: true
        createdAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue creado el objeto.
          readOnly: true
          example: 2022-06-12T21:21:10.587Z
        currentPeriodStart:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que inició el periodo de facturación actual.
          example: 2022-06-12T21:21:10.587Z
          readOnly: true
        currentPeriodEnd:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que finaliza el periodo de facturación actual.
          example: 2022-06-12T21:21:10.587Z
          readOnly: true
        customerId:
          type: string
          description: Identificador único del cliente asociado al cargo recurrente
          example: cl502zv0d0127ebdp3zt27651
        description:
          type: string
          description: Una descripción arbitraria del cargo recurrente.
          example: "Cargo recurrente de prueba"
        metadata:
          type: object
          description: |
            Objeto opcional que puede ser utilizado para guardar información adicional sobre el cargo recurrente. Puede ser útil para guardar información como el ID de una orden de compra, el ID de un carrito de compras, etc. Podés especificar hasta `50` pares de llave-valor. Las llaves y valores deben ser de tipo `string`. El nombre de las llaves debe de tener una longitud máxima de `40` caracteres, no puede incluir corchetes, y los valores una longitud máxima de `500` caracteres.
          additionalProperties:
            type: string
          maxProperties: 50
          example:
            orderId: "123456789"
            plan: "pro_monthly"
        paymentBehavior:
          type: string
          description: |
            El comportamiento del cargo recurrente. Puede ser `allow_incomplete` o `default_incomplete`, siendo el último el valor por defecto, si no se envía. 
            Si se envía `allow_incomplete`, el cargo recurrente se creará en forma inmediata, pero no se cobrará hasta que el cargo recurrente se confirme.
            Si no se envía, el cargo recurrente se creará en forma inmediata y se cobrará inmediatamente al método de pago indicado.
          example: "default_incomplete"
          enum:
            - allow_incomplete
            - default_incomplete
        startDate:
          type: string
          description: |
            Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8901" target="_blank">ISO 8901</a> y con zona
            horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se desea que se inicie el cargo recurrente. Si no se envía, el cargo recurrente se iniciará en el momento en que el cliente realice el pago de forma satisfactoria.
            Este atributo no es compatible si `paymentBehavior` es `allow_incomplete`.
          example: 2026-01-10T21:21:10.587Z
        paymentMethodId:
          type: string
          description: Identificador único del método de pago asociado al cargo recurrente. Si `paymentBehavior` es diferente a `allow_incomplete`, este atributo es obligatorio.
          example: cl502zv0d0127ebdp3zt27651
        mode:
          type: string
          description: El modo en el que existen los datos del objeto. Ya sea `test` o `live`.
          readOnly: true
          enum:
            - test
            - live
        items:
          type: array
          description: Lista de items asociados al cargo recurrente. Cada item representa un [precio](#tag/Precios) de tipo `recurring`.
          items:
            $ref: "#/components/schemas/SubscriptionItem"
        trialPeriodDays:
          type: integer
          description: El número de días de prueba que se desean brindar al cliente.
          example: 7
        trialStart:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se inicia el periodo de prueba, si el atributo de `trialPeriodDays` fue indicado.
          example: 2022-06-12T21:21:10.587Z
          readOnly: true
        trialEnd:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que se finaliza el periodo de prueba, si el atributo de `trialPeriodDays` fue indicado.
          example: 2022-06-12T21:21:10.587Z
          readOnly: true
        updatedAt:
          type: string
          description: Fecha y hora, en formato <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8901</a> y con zona horaria en <a href="https://en.wikipedia.org/wiki/Coordinated_Universal_Time" target="_blank">UTC</a>, en la que fue actualizado por última vez el objeto.
          readOnly: true
          example: 2022-06-12T21:21:10.587Z
        latestInvoice:
          type: object
          readOnly: true
          description: Objeto que contiene la información de la última renovación generada para el cargo recurrente.
          $ref: "#/components/schemas/Invoice"
